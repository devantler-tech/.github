name: 🔎 Routine governance audits

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: routine-governance-audits
  cancel-in-progress: false

jobs:
  admit:
    if: >-
      github.repository == 'devantler-tech/.github'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.admission.outputs.enabled }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout reviewed workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Decide audit admission
        id: admission
        run: bash scripts/governance-audit-admission.sh

  audit:
    needs: [admit]
    if: needs.admit.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout reviewed workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Get read-only complete-census token
        id: audit-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: devantler-tech # zizmor: ignore[github-app]
          permission-metadata: read
          permission-administration: read
      - name: Audit complete repository and admin-team coverage
        env:
          GH_TOKEN: ${{ steps.audit-token.outputs.token }}
          GH_INSTALLATION_ID: ${{ steps.audit-token.outputs.installation-id }}
          GH_APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: bash scripts/run-governance-audits.sh

  report:
    needs: [admit, audit]
    if: >-
      !cancelled()
      && github.repository == 'devantler-tech/.github'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && (needs.admit.result == 'failure' || needs.admit.outputs.enabled == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report incomplete or noncompliant audit
        if: needs.admit.result != 'success' || needs.audit.result != 'success'
        uses: devantler-tech/.github/actions/upsert-issue@498fb4b11f129928d3af9a90e9c5a46f1c4dbd77 # v7.0.0
        with:
          repository: devantler-tech/.github
          title: "Scheduled governance audits need attention"
          open: "true"
          body: |
            > 🤖 Generated by the Agentic Engineer

            The complete read-only governance audit did not pass.
            Review the failed admission or audit step before changing declared resources.
            An incomplete read is not a clean observation.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Admission: ${{ needs.admit.result }}
            Audit: ${{ needs.audit.result }}
      - name: Close only after a complete successful audit
        if: needs.admit.result == 'success' && needs.audit.result == 'success'
        uses: devantler-tech/.github/actions/upsert-issue@498fb4b11f129928d3af9a90e9c5a46f1c4dbd77 # v7.0.0
        with:
          repository: devantler-tech/.github
          title: "Scheduled governance audits need attention"
          open: "false"
          body: |
            > 🤖 Generated by the Agentic Engineer

            Both complete governance checks passed on reviewed main.
          close-comment: |
            > 🤖 Generated by the Agentic Engineer

            The complete audit passed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
