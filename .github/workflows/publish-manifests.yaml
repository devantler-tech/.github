name: 📦 Publish Manifests
on:
  workflow_call:
    inputs:
      oci-name:
        description: >-
          OCI repository name (`<owner>/<name>`) the manifests artifact is
          published under, WITHOUT the registry prefix or the trailing
          `/manifests` suffix. Defaults to the caller's `github.repository`.
          Override when the repo name is an invalid OCI path component — e.g. the
          org `.github` repo (leading dot) publishes under
          `devantler-tech/github-config`.
        required: false
        default: ""
        type: string
      deploy-path:
        description: "Path to the Kubernetes manifests directory packaged as the OCI artifact."
        required: false
        default: ./deploy
        type: string
      dry-run:
        description: "Skip publish (validate workflow interface only)."
        required: false
        default: false
        type: boolean
      enable-caller-pin:
        description: "Require a commit-SHA caller before signing. Enabled by default; explicit false remains supported during caller cleanup (#284)."
        required: false
        default: true
        type: boolean
      enable-signed-promotion:
        description: "Verify signature identity and publication claims before exposing release tags. Requires enable-caller-pin; default-off during rollout (#371)."
        required: false
        default: false
        type: boolean
      enable-signed-recovery:
        description: "Recover only a missing manifests version from its original signed digest; latest is preserved. Requires signed promotion and caller pinning; default-off (#425)."
        required: false
        default: false
        type: boolean
      recovery-digest:
        description: "Original signed manifests sha256 digest. Used only for explicit recovery."
        required: false
        default: ""
        type: string
      recovery-run-id:
        description: "Original publication run ID recorded in the signature."
        required: false
        default: ""
        type: string
      recovery-run-attempt:
        description: "Original publication run attempt recorded in the signature."
        required: false
        default: ""
        type: string
      recovery-workflow-sha:
        description: "Original immutable publish-manifests workflow commit in this catalogue repository."
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  publish-manifests:
    name: Publish manifests
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ format('publish-verified-{0}', inputs.oci-name || github.repository) }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read # checkout
      packages: write # push manifests OCI artifact
      id-token: write # keyless cosign signing (Fulcio/Rekor via GitHub OIDC)
    env:
      REGISTRY: ghcr.io # auth uses GITHUB_TOKEN, which is GHCR-scoped
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 🔒 Admit explicit recovery
        if: ${{ inputs.enable-signed-recovery }}
        env:
          ENABLE_SIGNED_PROMOTION: ${{ inputs.enable-signed-promotion }}
          ENABLE_CALLER_PIN: ${{ inputs.enable-caller-pin }}
        run: |
          [[ "$ENABLE_SIGNED_PROMOTION" == true && "$ENABLE_CALLER_PIN" == true ]] || {
            echo '::error::recovery requires signed promotion and caller pinning'
            exit 1
          }

      - name: 🔒 Require a semantic-version tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The WHOLE tag must be a SemVer 2.0.0 version behind a `v`, not merely start with one:
          # `v1.2.3garbage` would otherwise publish as `1.2.3garbage`, which neither Flux's semver
          # selection nor docker/metadata-action treats as a version. Refused here, before anything
          # reaches the registry. Keep this step identical in publish-app and publish-manifests.
          set -euo pipefail
          export LC_ALL=C
          num='(0|[1-9][0-9]*)'
          pre='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          build='[0-9A-Za-z-]+'
          semver="^v${num}\.${num}\.${num}(-${pre}(\.${pre})*)?(\+${build}(\.${build})*)?$"
          if [ "$REF_TYPE" != "tag" ] || ! [[ "$REF_NAME" =~ $semver ]]; then
            echo "::error::publish-manifests must be invoked from a semantic-version tag vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD] (got $REF_TYPE/$REF_NAME); releases are tagged and selected by semantic version."
            exit 1
          fi
          # An OCI tag cannot carry `+`, and SemVer ignores build metadata when ordering versions, so
          # publish without it — the same version docker/metadata-action derives for an image tag.
          version="${REF_NAME#v}"
          version="${version%%+*}"
          # Refuse what the parsers downstream cannot read or order either: docker/metadata-action's
          # takes at most 256 characters and numbers below 2^53, Flux's numbers below 2^64, and both
          # compare a longer numeric pre-release identifier as text. 15 digits always fit.
          numbers=".${version%%-*}."
          case "$version" in *-*) numbers="${numbers}${version#*-}." ;; esac
          too_long='\.[0-9]{16,}\.'
          if [ "${#REF_NAME}" -gt 256 ] || [[ "$numbers" =~ $too_long ]]; then
            echo "::error::publish-manifests refuses tag $REF_NAME: it must be at most 256 characters with numbers of at most 15 digits, so every tool downstream can read and order the version."
            exit 1
          fi
          if [ "${#version}" -gt 128 ]; then
            echo "::error::publish-manifests refuses tag $REF_NAME: version '$version' is longer than the 128 characters an OCI tag allows."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 🔎 Resolve the calling ref from the OIDC claim
        id: caller
        if: ${{ inputs.enable-caller-pin }}
        shell: bash
        run: |
          # github.job_workflow_ref is NOT exposed in the expression context — measured empty inside
          # a called reusable workflow, while github.workflow_ref (the caller's own entry workflow)
          # resolves fine. The value that actually reaches the cosign certificate's SAN is the OIDC
          # token's job_workflow_ref claim, so read it from the token: same source, same value.
          token="$(curl -fsS --max-time 10 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -r '.value')"
          payload="$(printf '%s' "$token" | cut -d. -f2)"
          case $((${#payload} % 4)) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          ref="$(printf '%s' "$payload" | tr '_-' '/+' | base64 -d | jq -r '.job_workflow_ref // ""')"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: 🔒 Require a SHA-pinned caller
        if: ${{ inputs.enable-caller-pin }}
        env:
          JOB_WORKFLOW_REF: ${{ steps.caller.outputs.ref }}
        run: |
          # This job mints a keyless cosign certificate whose SAN is this workflow's own
          # job_workflow_ref, and the cluster's trust rules verify signatures against it. A branch
          # or tag ref would let a superseded revision of this workflow mint a signature the
          # cluster still trusts, so require the one ref form that cannot move: a commit SHA.
          ref="${JOB_WORKFLOW_REF##*@}"
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::publish-manifests must be called by a 40-character commit SHA, not '@${ref}'. Pin the caller as devantler-tech/.github/.github/workflows/publish-manifests.yaml@<sha> (Renovate keeps that pin current)."
            exit 1
          fi

      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔐 Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.GH_TOKEN }}

      - name: ⚙️ Setup Flux CLI
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6

      - name: ✍️ Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 🔒 Reserve publisher helper checkout
        run: |
          { test ! -e .devantler-tech-publisher && test ! -L .devantler-tech-publisher; } || { echo '::error::reserved publisher helper path already exists'; exit 1; }

      - name: 📑 Checkout immutable publisher helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-publisher
          persist-credentials: false

      - name: 🔒 Prepare immutable publication guard
        run: |
          cp .devantler-tech-publisher/.github/scripts/require-unpublished-version.sh "$RUNNER_TEMP/require-unpublished-version.sh"
          cp .devantler-tech-publisher/.github/scripts/recover-manifests-version.sh "$RUNNER_TEMP/recover-manifests-version.sh"
          rm -rf -- .devantler-tech-publisher

      - name: 🔒 Refuse an occupied release version
        if: ${{ !inputs.enable-signed-recovery }}
        env:
          OCI_NAME: ${{ inputs.oci-name }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name="$(printf '%s' "${OCI_NAME:-$REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          OCI_REPOSITORIES="$name/manifests" bash "$RUNNER_TEMP/require-unpublished-version.sh"

      - name: 📦 Push & sign manifests artifact
        if: ${{ !(inputs.enable-signed-promotion == true || inputs.enable-signed-promotion == 'true') }}
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OCI_NAME: ${{ inputs.oci-name }}
          DEPLOY_PATH: ${{ inputs.deploy-path }}
          VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_WORKFLOW_REF: ${{ steps.caller.outputs.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          : "${VERSION:?the semantic-version tag step did not resolve a version}"
          # Default the OCI name to the caller repo; override (oci-name) for repos
          # whose name is an invalid OCI path component, e.g. `.github`. A registry
          # reference must be lowercase.
          NAME="$(printf '%s' "${OCI_NAME:-$REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          ARTIFACT="${REGISTRY}/${NAME}/manifests"
          if ! [[ "${RUN_ID:-}" =~ ^[0-9]+$ && "${RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]]; then
            echo '::error::publication requires a numeric workflow run ID and attempt' >&2
            exit 1
          fi
          PUSH_TAG="default-staging-${RUN_ID}-${RUN_ATTEMPT}"
          # Sign the digest this push produced (keyless via OIDC), never the tag re-resolved
          # later: two releases of one version (a re-run, or tags differing only in build
          # metadata) would otherwise let this run sign bytes it did not publish.
          PUSHED="$(flux push artifact "oci://${ARTIFACT}:${PUSH_TAG}" \
            --path="${DEPLOY_PATH}" \
            --source="${SERVER_URL}/${REPOSITORY}" \
            --revision="${REF_NAME}@sha1:${SHA}" \
            --creds "${ACTOR}:${GH_TOKEN}" \
            --output json)"
          DIGEST="$(printf '%s' "$PUSHED" | jq -r '.digest // ""')"
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::flux push did not report the pushed artifact digest"; exit 1
          fi
          cosign sign --yes "${ARTIFACT}@${DIGEST}"
          OCI_REPOSITORIES="$NAME/manifests" bash "$RUNNER_TEMP/require-unpublished-version.sh"
          flux tag artifact "oci://${ARTIFACT}@${DIGEST}" --tag "$VERSION" --creds "${ACTOR}:${GH_TOKEN}"
          case "$VERSION" in
            *-*) ;; # Prereleases keep the stable latest pointer.
            *) flux tag artifact "oci://${ARTIFACT}@${DIGEST}" --tag latest --creds "${ACTOR}:${GH_TOKEN}" ;;
          esac

      - name: 📦 Sign & promote manifests artifact
        if: ${{ !inputs.enable-signed-recovery && (inputs.enable-signed-promotion == true || inputs.enable-signed-promotion == 'true') }}
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OCI_NAME: ${{ inputs.oci-name }}
          DEPLOY_PATH: ${{ inputs.deploy-path }}
          VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_WORKFLOW_REF: ${{ steps.caller.outputs.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          : "${VERSION:?the semantic-version tag step did not resolve a version}"
          # The authenticated OIDC claim is also the certificate SAN; reject a
          # missing or mutable caller before the first registry write.
          if ! [[ "${JOB_WORKFLOW_REF:-}" =~ ^[^@]+@[0-9a-f]{40}$ ]]; then
            echo "::error::signed promotion requires enable-caller-pin and a SHA-pinned signer identity"
            exit 1
          fi
          if ! [[ "${RUN_ID:-}" =~ ^[0-9]+$ && "${RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::signed promotion requires a numeric workflow run ID and attempt"
            exit 1
          fi
          NAME="$(printf '%s' "${OCI_NAME:-$REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          ARTIFACT="${REGISTRY}/${NAME}/manifests"
          OCI_REPOSITORIES="$NAME/manifests" bash "$RUNNER_TEMP/require-unpublished-version.sh"
          PUSHED="$(flux push artifact "oci://${ARTIFACT}:staging-${RUN_ID}-${RUN_ATTEMPT}" \
            --path="${DEPLOY_PATH}" \
            --source="${SERVER_URL}/${REPOSITORY}" \
            --revision="${REF_NAME}@sha1:${SHA}" \
            --creds "${ACTOR}:${GH_TOKEN}" \
            --output json)"
          DIGEST="$(printf '%s' "$PUSHED" | jq -r '.digest // ""')"
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::flux push did not report the pushed artifact digest"; exit 1
          fi
          # Claims authenticate the original publication context for recovery.
          annotations=(
            -a "devantler.repository=$REPOSITORY"
            -a "devantler.source-sha=$SHA"
            -a "devantler.source-ref=$REF_NAME"
            -a "devantler.version=$VERSION"
            -a "devantler.run-id=$RUN_ID"
            -a "devantler.run-attempt=$RUN_ATTEMPT"
            -a "devantler.workflow-ref=$JOB_WORKFLOW_REF"
          )
          cosign sign --yes "${annotations[@]}" "${ARTIFACT}@${DIGEST}"
          cosign verify --certificate-identity "${SERVER_URL}/${JOB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${annotations[@]}" \
            "${ARTIFACT}@${DIGEST}"
          # Promotions read the verified digest, never a mutable staging alias.
          OCI_REPOSITORIES="$NAME/manifests" bash "$RUNNER_TEMP/require-unpublished-version.sh"
          flux tag artifact "oci://${ARTIFACT}@${DIGEST}" --tag "$VERSION" --creds "${ACTOR}:${GH_TOKEN}"
          case "$VERSION" in
            *-*) ;; # A prerelease is selectable by version but never becomes latest.
            *) flux tag artifact "oci://${ARTIFACT}@${DIGEST}" --tag latest --creds "${ACTOR}:${GH_TOKEN}" ;;
          esac

      - name: 🔏 Recover original manifests version
        if: ${{ inputs.enable-signed-recovery }}
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OCI_NAME: ${{ inputs.oci-name }}
          VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_WORKFLOW_REF: ${{ steps.caller.outputs.ref }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          ENABLE_SIGNED_PROMOTION: ${{ inputs.enable-signed-promotion }}
          ENABLE_CALLER_PIN: ${{ inputs.enable-caller-pin }}
          RECOVERY_DIGEST: ${{ inputs.recovery-digest }}
          RECOVERY_RUN_ID: ${{ inputs.recovery-run-id }}
          RECOVERY_RUN_ATTEMPT: ${{ inputs.recovery-run-attempt }}
          RECOVERY_WORKFLOW_SHA: ${{ inputs.recovery-workflow-sha }}
        run: bash "$RUNNER_TEMP/recover-manifests-version.sh"
