name: 🔎 Repository admin-team audit

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: repository-admin-team-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.repository == 'devantler-tech/.github'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout reviewed workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Get read-only audit token
        id: audit-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Every repository is necessary to detect undeclared private repositories.
          # The auditor rejects selected installations and incomplete enumeration.
          owner: devantler-tech # zizmor: ignore[github-app]
          permission-metadata: read
          permission-administration: read
      - name: Audit effective team permissions
        env:
          GH_TOKEN: ${{ steps.audit-token.outputs.token }}
          GH_INSTALLATION_ID: ${{ steps.audit-token.outputs.installation-id }}
          GH_APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: bash scripts/check-repository-admin-teams.sh
