name: 🔎 Repository admin-team audit

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: repository-admin-team-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.repository == 'devantler-tech/.github'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write # proves this job to the GitHub token broker (devantler-tech/monorepo ADR 0020)
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout reviewed workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Get read-only audit token
        id: audit-token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: sts.platform.devantler.tech
          scope: devantler-tech
          identity: repository-admin-team-audit
      - name: Audit effective team permissions
        env:
          GH_TOKEN: ${{ steps.audit-token.outputs.token }}
        run: bash scripts/check-repository-admin-teams.sh
