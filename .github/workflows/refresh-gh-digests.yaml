name: 🔒 Refresh reviewed GitHub CLI digests
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  refresh:
    if: ${{ github.repository == 'devantler-tech/.github' && github.ref == 'refs/heads/main' && github.workflow_ref == 'devantler-tech/.github/.github/workflows/refresh-gh-digests.yaml@refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: refresh-gh-digests
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: 📄 Checkout reviewed source
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: 🔒 Prepare the complete version manifest
        id: prepare
        run: bash .github/scripts/prepare-gh-digest-update.sh
      - name: 🔑 Generate repository-scoped App token
        id: app-token
        if: ${{ steps.prepare.outputs.changed == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: devantler-tech
          repositories: .github
          permission-contents: write
          permission-pull-requests: write
      - name: 📦 Open a signed draft for reviewed digests
        id: pr
        if: ${{ steps.prepare.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch-token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          draft: true
          add-paths: .scripts/gh-release-digests.tsv
          base: main
          branch: automation/gh-release-digests
          commit-message: 'fix(deps): pin reviewed GitHub CLI release digests'
          title: 'fix(deps): pin GitHub CLI ${{ steps.prepare.outputs.version }} release digests'
          body: |
            > 🤖 Generated by the Agentic Engineer

            ## Why

            The installer needs reviewed release digests to detect a substituted archive.

            ## What

            Pin the declared GitHub CLI version for every supported platform using its published release checksums. Older reviewed versions remain available.

            Part of #280
