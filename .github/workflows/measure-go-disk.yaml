name: Measure Go disk capacity
on:
  workflow_dispatch:
    inputs:
      enabled:
        type: boolean
        default: false
        description: Run the read-only large-consumer capacity evaluation
permissions: {}
concurrency:
  group: go-disk-capacity-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  measure:
    if: ${{ github.ref == 'refs/heads/main' && inputs.enabled == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        phase: [build, coverage]
        policy:
          - name: reclaim
            budget: 0
          - name: capacity
            budget: 64
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .disk-consumer
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout reviewed measurement code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout immutable large-consumer baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devantler-tech/ksail
          ref: 3115397431e2bdf31d911930908a9002a93a4340
          path: .disk-consumer
          persist-credentials: false
      - name: Record consumer baseline identity
        env:
          PHASE: ${{ matrix.phase }}
          POLICY: ${{ matrix.policy.name }}
          BUDGET: ${{ matrix.policy.budget }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$(git rev-parse HEAD)" == 3115397431e2bdf31d911930908a9002a93a4340 ]]
          printf 'GO_DISK_CONSUMER repository=devantler-tech/ksail head=%s\n' "$(git rev-parse HEAD)"
          mkdir "$RUNNER_TEMP/go-disk-receipts"
          jq -n --arg source "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg consumer "$(git rev-parse HEAD)" --arg phase "$PHASE" --arg policy "$POLICY" \
            --arg image "${ImageOS:-unknown}" --arg image_version "${ImageVersion:-unknown}" --argjson budget "$BUDGET" \
            '{source:$source,run:$run,attempt:$attempt,consumer:$consumer,phase:$phase,policy:$policy,budget_gib:$budget,image:$image,image_version:$image_version,cache:false}' \
            > "$RUNNER_TEMP/go-disk-receipts/identity.json"
      - name: Prepare cleanup measurement outside the consumer workspace
        run: install -m 700 "$GITHUB_WORKSPACE/.github/scripts/measure-go-disk.sh" "$RUNNER_TEMP/measure-go-disk.sh"
      - name: 🧹 Free disk space
        env:
          MINIMUM_FREE_DISK_GIB: ${{ matrix.policy.budget }}
          MEASURE_DISK_USAGE: "true"
          GO_DISK_CLEANUP_PHASE: cleanup-${{ matrix.phase }}
          GO_DISK_WORKFLOW_SHA: ${{ github.sha }}
          GO_DISK_CLEANUP_RECEIPT_FILE: ${{ runner.temp }}/go-disk-receipts/decision.json
          GO_DISK_RECEIPT_FILE: ${{ runner.temp }}/go-disk-receipts/cleanup.json
        run: |
          set -euo pipefail
          cleanup_disk() {
            # Zero preserves unconditional reclamation for every existing consumer.
            if [[ ! "$MINIMUM_FREE_DISK_GIB" =~ ^(0|[1-9][0-9]{0,3})$ ]] || ((MINIMUM_FREE_DISK_GIB > 1024)); then
              echo '::error::minimum-free-disk-gib must be a whole number from 0 through 1024'
              exit 2
            fi
            read_capacity() {
              local frame fields total used available timeout_command=timeout
              # Ubuntu 26 supplies GNU timeout under this explicit name.
              if command -v gnutimeout >/dev/null 2>&1; then timeout_command=gnutimeout; fi
              if ! frame="$("$timeout_command" --kill-after=1s 5s env LC_ALL=C df -Pk / 2>/dev/null)" ||
                 ! fields="$(awk 'NR == 2 {print $2, $3, $4} END {if (NR != 2) exit 1}' <<< "$frame")" ||
                 [[ ! "$fields" =~ ^([0-9]{1,12})[[:space:]]([0-9]{1,12})[[:space:]]([0-9]{1,12})$ ]]; then
                return 1
              fi
              total=$((10#${BASH_REMATCH[1]})); used=$((10#${BASH_REMATCH[2]})); available=$((10#${BASH_REMATCH[3]}))
              ((total > 0 && used <= total && available <= total && used + available <= total)) || return 1
              printf '%s\n' "$available"
            }
            before=null; after=null; status=measured; decision=reclaim
            before="$(read_capacity)" || { before=null; status=unknown; }
            if [[ "$before" != null ]] && ((MINIMUM_FREE_DISK_GIB > 0 && before >= MINIMUM_FREE_DISK_GIB * 1048576)); then
              # An opted-in caller supplied a budget, and a complete observation meets it.
              decision=retain
              after="$before"
            else
              # Unknown capacity retains the existing production protection.
              sudo rm -rf \
                /usr/local/lib/android \
                /usr/share/dotnet \
                /opt/ghc \
                /usr/local/share/boost \
                /usr/share/swift \
                /opt/hostedtoolcache/CodeQL \
                /opt/hostedtoolcache/PyPy \
                /usr/local/share/powershell \
                /usr/share/miniconda || true
              after="$(read_capacity)" || { after=null; status=unknown; }
            fi
            record="$(printf '{"status":"%s","decision":"%s","minimum_free_gib":%s,"before_available_kib":%s,"after_available_kib":%s}' \
              "$status" "$decision" "$MINIMUM_FREE_DISK_GIB" "$before" "$after")"
            printf 'GO_DISK_CLEANUP %s\n' "$record"
            if [[ -n "${GO_DISK_CLEANUP_RECEIPT_FILE:-}" ]]; then
              if ! (umask 077; printf '%s\n' "$record" > "$GO_DISK_CLEANUP_RECEIPT_FILE"); then
                echo '::warning::Go cleanup receipt could not be retained; native collection is incomplete' >&2
              fi
            fi
          }
          if [[ "$MEASURE_DISK_USAGE" == true ]]; then
            export -f cleanup_disk
            bash "$RUNNER_TEMP/measure-go-disk.sh" "$GO_DISK_CLEANUP_PHASE" bash -euo pipefail -c cleanup_disk
          else
            cleanup_disk
          fi

      - name: Setup consumer Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .disk-consumer/go.mod
          cache: false
      - name: Measure the actual consumer command
        env:
          PHASE: ${{ matrix.phase }}
          GO_DISK_RECEIPT_FILE: ${{ runner.temp }}/go-disk-receipts/command.json
        run: |
          set -euo pipefail
          go env GOVERSION > "$RUNNER_TEMP/go-disk-receipts/toolchain.txt"
          case "$PHASE" in
            build) bash "$GITHUB_WORKSPACE/.github/scripts/measure-go-disk.sh" build go build -v ./... ;;
            coverage) bash "$GITHUB_WORKSPACE/.github/scripts/measure-go-disk.sh" coverage go test -race -coverprofile="$RUNNER_TEMP/ksail-disk-coverage.txt" -covermode=atomic ./... ;;
            *) exit 2 ;;
          esac
      - name: Require complete observations
        env:
          PHASE: ${{ matrix.phase }}
          POLICY: ${{ matrix.policy.name }}
          BUDGET: ${{ matrix.policy.budget }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/go-disk-receipts"
          for file in cleanup command; do
            expected="$PHASE"
            [[ "$file" != cleanup ]] || expected="cleanup-$PHASE"
            jq -se --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg head "$GITHUB_SHA" --arg phase "$expected" \
              'length == 1 and .[0].status == "measured" and .[0].command_exit == 0 and .[0].run_id == $run and .[0].attempt == $attempt and .[0].head == $head and .[0].workflow_sha == $head and .[0].phase == $phase and
               (.[0].samples | type == "number" and . >= 2 and floor == .) and
               (.[0] | [.initial_available_kib,.final_available_kib,.minimum_available_kib,.maximum_used_kib] | all(.[]; type == "number" and . >= 0 and floor == .))' \
              "$directory/$file.json" > /dev/null
          done
          jq -se --argjson budget "$BUDGET" '
            length == 1 and .[0].status == "measured" and .[0].minimum_free_gib == $budget and
            (.[0].before_available_kib | type == "number" and . >= 0 and floor == .) and
            (.[0].after_available_kib | type == "number" and . >= 0 and floor == .) and
            (.[0] | if $budget > 0 and .before_available_kib >= $budget * 1048576 then .decision == "retain" else .decision == "reclaim" end)
          ' "$directory/decision.json" > /dev/null
          jq -se --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg head "$GITHUB_SHA" --arg phase "$PHASE" --arg policy "$POLICY" --argjson budget "$BUDGET" '
            length == 1 and .[0].source == $head and .[0].run == $run and .[0].attempt == $attempt and
            .[0].consumer == "3115397431e2bdf31d911930908a9002a93a4340" and .[0].phase == $phase and
            .[0].policy == $policy and .[0].budget_gib == $budget and .[0].cache == false and
            (.[0].image | type == "string" and length > 0 and . != "unknown") and
            (.[0].image_version | type == "string" and length > 0 and . != "unknown")
          ' "$directory/identity.json" > /dev/null
          [[ "$(cat "$directory/toolchain.txt")" =~ ^go[0-9]+\.[0-9]+ ]]
      - name: Retain small measurement receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-disk-${{ matrix.phase }}-${{ matrix.policy.name }}
          path: ${{ runner.temp }}/go-disk-receipts/
          if-no-files-found: error
          retention-days: 7
