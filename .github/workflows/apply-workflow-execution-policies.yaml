name: 🛡️ Apply workflow execution policies

# Makes the organization's Actions policies (workflow execution protections)
# match the reviewed files in workflow-execution-policies/. The Crossplane
# GitHub provider cannot manage these policies yet, so this workflow applies
# them until it can; moving them into deploy/ is tracked in #226.
#
# It runs when a change to the policies or to this reconciler lands on main,
# daily so a policy changed by hand is set back, and on demand. It never runs
# for a pull request: its token can administer the organization, so it only
# ever runs reviewed code from main.

on:
  push:
    branches: [main]
    paths:
      - workflow-execution-policies/**
      - scripts/apply-workflow-execution-policies.sh
      - scripts/validate-workflow-execution-policies.sh
      - scripts/workflow-policy-selectors.jq
      - .github/workflows/apply-workflow-execution-policies.yaml
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions: {}

# Two runs writing the same policies at once could both create one.
concurrency:
  group: apply-workflow-execution-policies
  cancel-in-progress: false

jobs:
  apply:
    name: 🛡️ Apply workflow execution policies
    runs-on: ubuntu-latest
    # workflow_dispatch can name any branch; only main is reviewed.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read # checkout
      id-token: write # proves this workflow's identity to the GitHub token broker
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The GitHub token broker (devantler-tech/monorepo ADR 0020) grants this
      # write authority through
      # .github/chainguard/apply-workflow-execution-policies.sts.yaml: organization
      # administration write, which is what manages Actions policies, scoped to
      # this repository because nothing here touches another. The policy pins
      # botantler-2. No App key is read, and the action's post step revokes the
      # token.
      - name: 🔑 Get an organization administration token from the token broker
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: app-token
        with:
          domain: sts.platform.devantler.tech
          scope: devantler-tech
          identity: apply-workflow-execution-policies

      - name: 🛡️ Apply the policies
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: bash scripts/apply-workflow-execution-policies.sh --org "$ORG"
