name: 🔄 Template Sync

on:
  workflow_call:
    inputs:
      source-repo-path:
        description: >-
          The `owner/repo` path of the upstream template repository to sync from
          (passed to `actions-template-sync` as `source_repo_path`). When
          `use-app-token` is set, the App token is auto-scoped to read this repo
          as well, so a PRIVATE template under the same owner works out of the
          box; a cross-owner private template needs a custom token with read
          access to it.
        required: true
        type: string
      upstream-branch:
        description: Branch of the template repository to sync from
        required: false
        type: string
        default: main
      pr-title:
        description: >-
          Title of the sync PR. Defaults to a Conventional-Commit `chore:` title
          because every consumer squash-merges on the PR title into its changelog.
        required: false
        type: string
        default: "chore: sync changes from the upstream template"
      pr-commit-msg:
        description: Commit message for the sync PR
        required: false
        type: string
        default: "chore: sync changes from the upstream template"
      pr-labels:
        description: Comma-separated labels applied to the sync PR
        required: false
        type: string
        default: dependencies,automation
      pr-branch-name-prefix:
        description: Prefix for the branch the sync PR is opened from
        required: false
        type: string
        default: chore/template-sync
      template-sync-ignore-file-path:
        description: >-
          Path to the ignore file listing consumer-owned files that must NOT be
          overwritten by the template (same format as `.gitignore`).
        required: false
        type: string
        default: .templatesyncignore
      merge-template-ignore-entries:
        description: >-
          When `true`, add every entry of the template's ignore file that the
          caller's ignore file lacks before syncing, so an exclusion the
          template adds after the caller was created applies there too. The
          caller's own entries are kept, and a caller line `!<entry>` keeps that
          one template entry out. The merged list is part of the sync PR.
          Release flag, default `false`
          (devantler-tech/platform-tenant-template#171).
        required: false
        default: false
        type: boolean
      dry-run:
        description: "Skip the sync and PR creation (validate the workflow interface only)"
        required: false
        default: false
        type: boolean
      use-app-token:
        description: >-
          When `true`, open the sync PR with a GitHub App token
          (minted from the `APP_CLIENT_ID` variable and the `APP_PRIVATE_KEY` secret)
          instead of the default `GITHUB_TOKEN`. A PR opened with `GITHUB_TOKEN`
          does NOT trigger the caller's `on: pull_request`/`push` CI runs. Only
          opt in after ensuring CI treats template-sync PR content as untrusted.
        required: false
        default: false
        type: boolean
    secrets:
      APP_PRIVATE_KEY:
        description: >-
          GitHub App private key, required when `use-app-token` is `true` (the
          non-default opt-in). Paired with the `APP_CLIENT_ID`
          repository/organization variable to mint an App token for opening the
          sync PR.
        required: false

permissions: {}

jobs:
  template-sync:
    name: Template sync
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 🧮 Resolve template repo name
        id: template
        if: ${{ inputs.use-app-token }}
        shell: bash
        env:
          SOURCE_REPO_PATH: ${{ inputs.source-repo-path }}
        run: echo "name=${SOURCE_REPO_PATH##*/}" >> "$GITHUB_OUTPUT"

      - name: 🔑 Generate GitHub App token
        id: app-token
        if: ${{ inputs.use-app-token }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Scope the token to exactly the caller repo (push the sync branch +
          # open the PR) AND the upstream template repo (clone it — required when
          # the template is PRIVATE, harmless when it is public). Assumes both
          # live under the same owner; a cross-owner private template needs its
          # own read-scoped token instead.
          repositories: ${{ github.event.repository.name }},${{ steps.template.outputs.name }}
          permission-contents: write
          permission-pull-requests: write
          # The template ships `.github/workflows/**`; pushing a sync commit that
          # creates/updates a workflow file requires the `workflows` scope, else
          # GitHub rejects the push ("refusing to allow a GitHub App to create or
          # update workflow … without `workflows` permission"). This is the ONLY
          # token path that can sync workflow changes — the `use-app-token: false`
          # fallback (`GITHUB_TOKEN`) can never push workflow files regardless of
          # job permissions (a GitHub safety restriction), so a template carrying
          # workflow changes requires explicitly opting in with
          # `use-app-token: true`.
          # NOTE: the App must have the **Workflows** repository permission granted
          # for this scope to mint; without it `create-github-app-token` 422s.
          permission-workflows: write

      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # actions-template-sync needs full history to compute and merge the
          # template diff. It handles its own source and target authentication,
          # so the checkout does not need to persist credentials.
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token || github.token }}

      # actions-template-sync restores the caller's ignore file to its committed copy after
      # pulling the template, so the template's list never decides what the caller receives. With
      # the flag on, commit the merged list locally first: the action then restores and applies
      # it, and the signing step folds this commit into the one signed sync commit.
      - name: 📑 Checkout shared ignore-merge helper
        if: ${{ inputs.merge-template-ignore-entries }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-actions
          persist-credentials: false

      - name: 🧩 Merge the template's ignore entries
        id: merge-ignore
        if: ${{ inputs.merge-template-ignore-entries }}
        shell: bash
        env:
          BASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          IGNORE_FILE: ${{ inputs.template-sync-ignore-file-path }}
          SOURCE_REPO_PATH: ${{ inputs.source-repo-path }}
          UPSTREAM_BRANCH: ${{ inputs.upstream-branch }}
        run: |
          commit="$(bash .devantler-tech-actions/.github/scripts/merge-template-sync-ignore.sh \
            --base-sha "$BASE_SHA" \
            --source-repo "$SOURCE_REPO_PATH" \
            --ref "$UPSTREAM_BRANCH" \
            --ignore-file "$IGNORE_FILE")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The action stages the whole workspace, so the helper checkout must be gone before it runs.
      - name: 🧹 Remove shared ignore-merge helper
        if: ${{ always() && inputs.merge-template-ignore-entries }}
        shell: bash
        run: rm -rf -- .devantler-tech-actions

      - name: 🔄 Sync from template
        uses: AndreasAugustin/actions-template-sync@6e1d0089686f8940604fc15baae62367bf6ee860 # v2.6.0
        with:
          source_repo_path: ${{ inputs.source-repo-path }}
          upstream_branch: ${{ inputs.upstream-branch }}
          source_gh_token: ${{ steps.app-token.outputs.token || github.token }}
          target_gh_token: ${{ steps.app-token.outputs.token || github.token }}
          pr_title: ${{ inputs.pr-title }}
          pr_commit_msg: ${{ inputs.pr-commit-msg }}
          pr_labels: ${{ inputs.pr-labels }}
          pr_branch_name_prefix: ${{ inputs.pr-branch-name-prefix }}
          template_sync_ignore_file_path: ${{ inputs.template-sync-ignore-file-path }}

      - name: 📑 Checkout shared signing helper
        if: ${{ inputs.use-app-token }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-actions
          persist-credentials: false

      # Before signing, the helper keeps the target's devantler-tech/.github pin wherever the
      # template's pin for the same path is older (ordered by commit ancestry through the compare
      # API), so a template that lags its consumer cannot downgrade it (#1239). Workflow files can
      # only be synced on this App-token path, so this is where the guard runs; a pin in a
      # non-workflow file (such as a local composite action) synced without the App token is not
      # checked.
      - name: ✍️ Replace sync commit with a verified App commit
        if: ${{ inputs.use-app-token }}
        shell: bash
        env:
          BASE_SHA: ${{ github.sha }}
          BRANCH_PREFIX: ${{ inputs.pr-branch-name-prefix }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IGNORE_FILE: ${{ inputs.template-sync-ignore-file-path }}
          PRE_SYNC_SHA: ${{ steps.merge-ignore.outputs.commit }}
        run: |
          pre_sync=()
          if [[ -n "$PRE_SYNC_SHA" ]]; then
            pre_sync=(--pre-sync-sha "$PRE_SYNC_SHA" --pre-sync-path "$IGNORE_FILE")
          fi
          result="$(bash .devantler-tech-actions/.github/scripts/replace-template-sync-commit.sh \
            --base-sha "$BASE_SHA" \
            --branch-prefix "$BRANCH_PREFIX" \
            "${pre_sync[@]}")"
          echo "Template-sync signing result: $result"

      - name: 🧹 Remove shared signing helper
        if: ${{ always() && inputs.use-app-token }}
        shell: bash
        run: rm -rf -- .devantler-tech-actions
