name: Native application signing trial
on:
  workflow_call:
    inputs:
      trial-head:
        required: true
        type: string
permissions: {}
jobs:
  native:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout immutable trial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devantler-tech/.github
          ref: ${{ inputs.trial-head }}
          path: trial
          persist-credentials: false
      - name: Checkout tested publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devantler-tech/.github
          ref: 09b7780f53fe513078ac146bd58787c52577baa1
          path: source
          persist-credentials: false
      - name: Setup Flux
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Execute production application publication bodies
        shell: bash
        env:
          TRIAL_HEAD: ${{ inputs.trial-head }}
        run: bash trial/.github/scripts/native-app-signing-trial.sh source
