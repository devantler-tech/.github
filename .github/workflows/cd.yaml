name: 🚀 CD

# Publishes the org's declarative GitHub state (deploy/) as a cosign-signed OCI
# artifact consumed by the platform cluster's `github-config` tenant. There is
# NO container image here, only manifests, so the publish-app action runs in
# `manifests` mode.
#
# The OCI path is `github-config` (not the repo name) because `.github` is an
# invalid OCI path component (leading dot), hence the oci-name override.
#
# The action runs directly in this workflow, so the cosign certificate identity
# (OIDC subject) is this repository's own release workflow on its tag:
# https://github.com/devantler-tech/.github/.github/workflows/cd.yaml@refs/tags/vX.Y.Z
# (monorepo ADR 0017). The platform `github-config` OCIRepository accepts exactly
# that file on a release tag (k8s/bases/apps/github-config/oci-repository.yaml in
# devantler-tech/platform). This repository also hosts reusable workflows, and a
# caller of a reusable workflow signs with that workflow's identity, so this file
# must stay uncallable: .github/scripts/check-manifests-caller.sh admits only this
# exact tag-only shape. `$/actions/publish-app` is the action at this same tagged
# commit.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish-manifests:
    name: 🗳️ Publish manifests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Serialize this repository's publishers and never cancel or drop a pending release.
    concurrency:
      group: publish-verified-devantler-tech/github-config
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read # checkout and the default-branch fetch
      packages: write # push the OCI artifact to GHCR
      id-token: write # keyless cosign signing as this workflow (Fulcio + Rekor via GitHub OIDC)
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # required: publish-app refuses a persisted credential
      - name: 📦 Publish signed manifests
        uses: $/actions/publish-app
        with:
          mode: manifests
          oci-name: devantler-tech/github-config
