name: 📝 Scan for TODO Comments

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Exercise the action wrapper offline without issue creation"
        required: false
        default: false
        type: boolean
      ignore:
        description: "Regular expression matching repository-relative paths to ignore"
        required: false
        default: ""
        type: string
      exclude-vendored:
        description: "Opt in to excluding root vendor/ and third_party/ when ignore is empty; rollout retirement is tracked in #394"
        required: false
        default: false
        type: boolean
      optional-project-auth:
        description: "Opt in to optional project integration; existing callers keep their behavior"
        required: false
        default: false
        type: boolean
      project:
        description: "Project selection; set empty with optional-project-auth to omit project integration"
        required: false
        default: "organization/devantler-tech/5"
        type: string
    secrets:
      APP_PRIVATE_KEY:
        description: "Required for production project integration; unused in dry-run"
        required: false

permissions: {}

jobs:
  dry-run:
    if: ${{ inputs.dry-run }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📥 Checkout devantler-tech/.github (this workflow's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-actions
          persist-credentials: false

      # The fail-closed Docker stand-in validates the actual wrapper and forwarded
      # caller inputs. Real scanner discovery/payload coverage runs separately in CI.
      - name: 🧪 Prepare offline Docker fixture
        env:
          TODO_EXPECTED_TOKEN: ${{ github.token }}
          TODO_EXPECTED_BEFORE: ${{ github.event.before || github.base_ref }}
          TODO_EXPECTED_COMMITS: ${{ toJSON(github.event.commits) }}
          TODO_EXPECTED_DIFF: ${{ github.event.pull_request.diff_url }}
          TODO_EXPECTED_IGNORE: ${{ inputs.ignore || ((inputs.exclude-vendored == true || inputs.exclude-vendored == 'true') && '^(vendor|third_party)/') || '' }}
        run: bash .devantler-tech-actions/.github/tests/todo-action-smoke.sh prepare

      - name: 🧪 Run actual wrapper offline
        uses: ./.devantler-tech-actions/actions/create-issues-from-todos
        with:
          ignore: ${{ inputs.ignore }}
          exclude-vendored: ${{ inputs.exclude-vendored }}
          optional-project-auth: "true"

      # The composite checkout cleans this directory. Restore the exact workflow
      # commit for the verifier and for the runner to reload composite post steps.
      - name: 📥 Restore devantler-tech/.github for post-cleanup
        if: ${{ always() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-actions
          persist-credentials: false

      - name: 🧪 Verify one actual offline invocation
        run: bash .devantler-tech-actions/.github/tests/todo-action-smoke.sh verify-once

  todos:
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Self-reference: check out THIS workflow's own repo at the exact commit it is running
      # from (job.workflow_repository / job.workflow_sha), then call the sibling action by
      # local path. Same-commit resolution — no release lag, no tag refs; consumer SHA-pinning
      # policies see only the pinned actions/checkout plus a local `./` path. The composite's
      # own internal checkout then re-syncs the workspace (git clean removes this untracked
      # dir), so the to-do comment scan never sees the actions repo's sources. (Always hyphenated
      # here: the scanner matches the marker in any letter case, so naming it would file an issue.)
      - name: 📥 Checkout devantler-tech/.github (this workflow's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-actions
          persist-credentials: false

      - name: 📝 Create issues from TODOs
        uses: ./.devantler-tech-actions/actions/create-issues-from-todos
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          project: ${{ inputs.project }}
          ignore: ${{ inputs.ignore }}
          exclude-vendored: ${{ inputs.exclude-vendored }}
          optional-project-auth: ${{ inputs.optional-project-auth }}

      # The sibling composite runs its own actions/checkout, whose git clean deletes this
      # untracked self-checkout mid-job. That is intended (it hides the actions sources from
      # the to-do scan above), but the runner re-reads the composite's action.yaml from disk to
      # run its post-cleanup steps — which then fails with "Can't find action.yml". Re-materialise
      # the directory AFTER the scan so the post phase can reload it; the scanner has already run,
      # so it still never sees the actions repo's own sources.
      - name: 📥 Restore devantler-tech/.github for post-cleanup
        if: ${{ always() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-actions
          persist-credentials: false
