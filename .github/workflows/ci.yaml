name: CI

# Validates the declarative GitHub state in deploy/ on every PR, and reports the
# `CI - Required Checks` status the org ruleset requires before merge. (cd.yaml
# only runs on v* tags, so without this no PR-time required check is produced and
# the PR stays merge-BLOCKED.)

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:

permissions: {}

jobs:
  validate-manifests:
    name: 🧹 Validate manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🚦 Validate release contract
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # GitHub squashes a SINGLE-commit branch under that commit's subject
          # (squash_merge_commit_title = COMMIT_OR_PR_TITLE) and ignores the
          # title, so the guard needs both to judge the subject that will land.
          COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          first_subject="$(git log --format=%s "$BASE_SHA..$HEAD_SHA" | tail -1)"
          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
            bash scripts/validate-release-contract.sh "$PR_TITLE" "$COMMIT_COUNT" "$first_subject"

      - name: 🧹 Validate deploy/ kustomize build
        # kubectl (with built-in kustomize) is preinstalled on the runner. A
        # successful build proves the manifests are well-formed; the Crossplane
        # CRDs are applied/validated on-cluster, not here.
        run: kubectl kustomize deploy/ > /dev/null

      - name: 🗑️ Validate deploy/ deletions are acknowledged
        # Compares the RENDERED deploy/ output at the base and head by resource
        # identity, so a resource cut out of a multi-document file is caught as
        # surely as a deleted file. Every removed identity needs its own
        # `Deletion-Acknowledged: <Kind>.<group>/<name>` line in the pull-request body.
        # The body arrives through an env var and is written to a file — never
        # interpolated into the shell — because it is contributor-authored text.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          kubectl kustomize "$RUNNER_TEMP/base/deploy" > "$RUNNER_TEMP/base-render.yaml" ||
            { echo "deploy-deletions: UNKNOWN — the base deploy/ tree does not render; repair main first" >&2; exit 2; }
          kubectl kustomize deploy/ > "$RUNNER_TEMP/head-render.yaml" ||
            { echo "deploy-deletions: UNKNOWN — this pull request's deploy/ tree does not render" >&2; exit 2; }
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          bash scripts/validate-deploy-deletions.sh \
            "$RUNNER_TEMP/base-render.yaml" "$RUNNER_TEMP/head-render.yaml" "$RUNNER_TEMP/pr-body.txt"

      - name: 🧪 Test active Admins policy
        run: bash tests/admin-team-policy.sh

      - name: 🧪 Test declarative coverage
        run: bash tests/declarative-coverage.sh

      - name: 🧪 Test declarative coverage failure handling
        run: bash tests/declarative-coverage-fail-closed.sh

      - name: 🧪 Test repository update policy
        run: bash tests/repository-update-policy.sh

      - name: 🧪 Test release contract
        run: bash tests/release-contract.sh

      - name: 🧪 Test deploy/ deletion acknowledgement
        run: bash tests/deploy-deletions.sh

      - name: 🧪 Test World at Ruin trusted-regression ruleset
        run: bash tests/world-at-ruin-regression-ruleset.sh

      # The drift check itself reads live GitHub state and runs on a schedule
      # (repository-drift-check.yaml); this only pins its comparison logic,
      # against fixtures, so it stays offline and PR-safe.
      - name: 🧪 Test repository drift check
        run: bash tests/repository-drift.sh

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs: [validate-manifests]
    if: always()
    permissions: {}
    steps:
      - name: 📊 Evaluate job results
        uses: devantler-tech/actions/aggregate-job-checks@3ee6cb9bbd616c2a38779be41a5e41f3e77282d0 # v13.2.3
        with:
          job-results: >-
            ${{ needs.validate-manifests.result }}
