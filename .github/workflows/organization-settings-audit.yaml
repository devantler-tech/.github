name: 🔎 Organization settings audit

on:
  workflow_dispatch:
    inputs:
      run-audit:
        description: "Opt in to the read-only audit; scheduling and flag retirement are tracked in #404"
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: organization-settings-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.repository == 'devantler-tech/.github'
      && github.ref == 'refs/heads/main'
      && (inputs.run-audit == true || inputs.run-audit == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # proves this workflow's identity to the GitHub token broker
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout reviewed workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      # The GitHub token broker (devantler-tech/monorepo ADR 0020) grants this
      # read authority through .github/chainguard/organization-settings-audit.sts.yaml:
      # organization administration and metadata read, scoped to this repository.
      # No App key is read, and the action's post step revokes the token.
      - name: Get read-only organization audit token
        id: audit-token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: sts.platform.devantler.tech
          scope: devantler-tech
          identity: organization-settings-audit
      - name: Audit organization settings
        env:
          GH_TOKEN: ${{ steps.audit-token.outputs.token }}
        run: bash scripts/check-organization-settings.sh
