name: 🗂️ Triage Stale Issues

on:
  workflow_call:
    inputs:
      dry-run:
        description: Read-only preview; no issue changes or saved progress.
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  preview:
    if: ${{ inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: read
      actions: read
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Preview stale-issue triage
        uses: $/actions/triage-stale-issues
        with:
          dry-run: "true"

  triage:
    # Only live writes share the repository progress cursor.
    concurrency:
      group: stale-issues-${{ github.repository }}
      cancel-in-progress: false
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      # actions/stale saves a resumable cursor and removes its old cache entry.
      actions: write
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Triage stale issues
        uses: $/actions/triage-stale-issues
