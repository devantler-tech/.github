name: 🔄 Sync Cluster Policies

on:
  workflow_call:
    secrets:
      APP_PRIVATE_KEY:
        description: "GitHub App Private Key"
        required: true
    inputs:
      dry-run:
        description: "Skip sync and PR creation (validate workflow interface only)"
        required: false
        default: false
        type: boolean
      kyverno-policies-dir:
        description: "Directory to sync Kyverno policies to"
        required: true
        type: string

permissions: {}

jobs:
  sync-policies:
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    env:
      KYVERNO_POLICIES_DIR: ${{ inputs.kyverno-policies-dir }}
      KYVERNO_POLICIES_TEMP_DIR: /tmp/cluster-policies

    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege token scope: checkout and open the sync PR.
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}
      - name: Download latest Cluster Policies
        run: |
          git clone --filter=blob:none --sparse https://github.com/kyverno/policies "$KYVERNO_POLICIES_TEMP_DIR"
          cd "$KYVERNO_POLICIES_TEMP_DIR" || exit 1
          git sparse-checkout set --no-cone '*/' ':!.*'
      - name: Verify allowlisted policies still exist upstream
        id: verify-allowlist
        run: |
          # Validate and snapshot configuration before removing any upstream file.
          # An explicitly empty readable file includes everything; missing or
          # unreadable configuration must never silently broaden a sync (#262).
          policyignore="$PWD/.policyignore"
          [[ -f "$policyignore" && -r "$policyignore" ]] ||
            { echo "::error::.policyignore must be a readable regular file"; exit 1; }
          cat -- "$policyignore" >"$RUNNER_TEMP/policyignore.snapshot" ||
            { echo "::error::could not read .policyignore"; exit 1; }
          cd "$KYVERNO_POLICIES_TEMP_DIR" || exit 1
          find . -type f -not -path './.git/*' -print0 >"$RUNNER_TEMP/policy-files" ||
            { echo "::error::could not enumerate the upstream clone"; exit 1; }
          exclusions="$RUNNER_TEMP/policy-excluded"
          mkdir -p "$exclusions"
          missing=()
          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            pattern="$line"
            include=0
            if [[ "$line" == '!'* ]]; then
              include=1
              pattern="${line#!}"
              [[ -n "$pattern" ]] || continue
              # Negating an escaped comment/negation still names that literal file.
              [[ "$pattern" != '#'* && "$pattern" != '!'* ]] || pattern="\\$pattern"
            fi
            # Git supplies path anchoring, basename, **, directory and escape
            # semantics. Apply one positive pattern at a time: workflow-owned
            # ordering preserves reinclusion below an excluded parent.
            printf '%s\n' "$pattern" >"$RUNNER_TEMP/policy-pattern"
            git ls-files --cached --ignored -z --exclude-from="$RUNNER_TEMP/policy-pattern" >"$RUNNER_TEMP/policy-matches" ||
              { echo "::error::could not match .policyignore against upstream policies"; exit 1; }
            matched=0
            while IFS= read -r -d '' file; do
              [[ -f "$file" && ! -L "$file" && "$file" != .git/* ]] || continue
              matched=1
              marker="$exclusions/$file"
              if [[ "$include" == 1 ]]; then
                rm -f -- "$marker"
              else
                mkdir -p "${marker%/*}"
                : >"$marker"
              fi
            done <"$RUNNER_TEMP/policy-matches"
            # A literal reinclusion that vanished upstream must fail before the
            # caller's vendored copy could be deleted (#320). Escaped wildcard
            # characters are literals; unmatched glob reinclusions are allowed.
            glob=0
            for ((i = 0; i < ${#pattern}; i++)); do
              case "${pattern:i:1}" in
                \\) i=$((i + 1)) ;;
                '*'|'?'|'[') glob=1 ;;
              esac
            done
            if [[ "$include" == 1 && "$glob" == 0 && "$matched" == 0 ]]; then
              missing+=("${line#!}")
            fi
          done <"$RUNNER_TEMP/policyignore.snapshot"
          if [ "${#missing[@]}" -gt 0 ]; then
            for path in "${missing[@]}"; do
              echo "::error::.policyignore re-includes '$path', but upstream kyverno/policies no longer has it. Repoint or remove that line, or vendor the policy yourself."
            done
            exit 1
          fi
          : >"$RUNNER_TEMP/policy-exclusions"
          while IFS= read -r -d '' file; do
            file="${file#./}"
            [[ ! -f "$exclusions/$file" ]] || printf '%s\0' "$file" >>"$RUNNER_TEMP/policy-exclusions"
          done <"$RUNNER_TEMP/policy-files"
      - name: Remove blacklisted policies
        id: filter-policies
        run: |
          cd "$KYVERNO_POLICIES_TEMP_DIR" || exit 1
          # Consume the complete, successfully validated plan; never reread live
          # configuration or hide a failed read in process substitution.
          [[ -f "$RUNNER_TEMP/policy-exclusions" && -r "$RUNNER_TEMP/policy-exclusions" ]] ||
            { echo "::error::validated policy exclusion plan is missing"; exit 1; }
          while IFS= read -r -d '' rel; do
            rm -f -- "$rel"
          done <"$RUNNER_TEMP/policy-exclusions"
          # Prune directories left empty by the removals.
          find . -type d -not -path './.git' -not -path './.git/*' -empty -delete 2>/dev/null || true
      - name: Copy Cluster Policies to the target directory
        id: copy-policies
        run: |
          # Stage and verify the whole selection beside the target before touching
          # it, then swap it in. Any failure leaves the previous policies in place,
          # so a sync pull request never carries removals a failed copy caused (#356).
          src="$KYVERNO_POLICIES_TEMP_DIR"
          target="${KYVERNO_POLICIES_DIR%/}"
          [[ -n "$target" ]] || { echo "::error::kyverno-policies-dir must not be empty"; exit 1; }
          for plan in policy-files policy-exclusions; do
            [[ -f "$RUNNER_TEMP/$plan" && -r "$RUNNER_TEMP/$plan" ]] ||
              { echo "::error::validated policy plan $plan is missing"; exit 1; }
          done
          mkdir -p -- "$target" || { echo "::error::could not create $target"; exit 1; }
          shopt -s nullglob
          selected=("$src"/*)
          if [[ ${#selected[@]} -eq 0 ]]; then
            # Empty only on purpose: .policyignore excluded every upstream file.
            upstream="$(tr -cd '\0' <"$RUNNER_TEMP/policy-files" | wc -c)"
            excluded="$(tr -cd '\0' <"$RUNNER_TEMP/policy-exclusions" | wc -c)"
            if [[ "$upstream" -gt 0 && "$upstream" -eq "$excluded" ]]; then
              echo "::notice::.policyignore excludes all $((upstream)) upstream policy files, so $target is emptied deliberately"
            else
              echo "::error::no policies were selected, but .policyignore excludes only $((excluded)) of $((upstream)) upstream files; $target is unchanged"
              exit 1
            fi
          fi
          stage="$(mktemp -d "$target.sync.XXXXXX")" || { echo "::error::could not create a staging directory"; exit 1; }
          backup="$(mktemp -d "$target.previous.XXXXXX")" || { rm -rf -- "$stage"; echo "::error::could not create a backup directory"; exit 1; }
          trap 'rm -rf -- "$stage" "$backup"' EXIT
          if [[ ${#selected[@]} -gt 0 ]]; then
            cp -R -- "${selected[@]}" "$stage/" ||
              { echo "::error::copying the selected policies failed; $target is unchanged"; exit 1; }
            for entry in "${selected[@]}"; do
              diff -r -- "$entry" "$stage/${entry##*/}" >/dev/null ||
                { echo "::error::the staged copy of ${entry##*/} differs from the selection; $target is unchanged"; exit 1; }
            done
          fi
          unpark() {
            local parked=("$backup"/*)
            [[ ${#parked[@]} -eq 0 ]] || mv -- "${parked[@]}" "$target/"
          }
          previous=("$target"/*)
          if [[ ${#previous[@]} -gt 0 ]] && ! mv -- "${previous[@]}" "$backup/"; then
            unpark || echo "::error::could not restore the previous policies in $target"
            echo "::error::could not set the previous policies aside; nothing was synced"
            exit 1
          fi
          staged=("$stage"/*)
          if [[ ${#staged[@]} -gt 0 ]] && ! mv -- "${staged[@]}" "$target/"; then
            # Every previous entry is parked, so each staged name in the target came from the stage.
            for entry in "${staged[@]}"; do rm -rf -- "${target:?}/${entry##*/}"; done
            unpark || echo "::error::could not restore the previous policies in $target"
            echo "::error::could not move the verified policies into $target; nothing was synced"
            exit 1
          fi
          echo "Synced ${#selected[@]} top-level policy entries into $target"
      - name: Create PR with changes
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: sync cluster policies"
          title: "chore: sync cluster policies"
          body: "Sync Cluster Policies from <https://github.com/kyverno/policies>"
          branch: sync-cluster-policies
          delete-branch: true
          signoff: true
          sign-commits: true
          reviewers: devantler
          assignees: devantler
          token: ${{ steps.generate-token.outputs.token }}
          branch-token: ${{ steps.generate-token.outputs.token }}
