name: 🅿️ Reconcile parked merges

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions: {}

concurrency:
  group: reconcile-parked-merges
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.repository == 'devantler-tech/.github'
      && github.ref == 'refs/heads/main'
      && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # proves this workflow's identity to the GitHub token broker
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout reviewed workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      # The GitHub token broker (devantler-tech/monorepo ADR 0020) grants this
      # authority through .github/chainguard/reconcile-parked-merges.sts.yaml:
      # every parked pull request in the organization is in scope, so metadata
      # read and contents and pull request write, organization-wide, from either
      # botantler App. No App key is read,
      # and the action's post step revokes the token.
      - name: Get organization-wide revocation token
        id: app-token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: sts.platform.devantler.tech
          scope: devantler-tech
          identity: reconcile-parked-merges
      - name: Revoke pending merges on parked pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/reconcile-parked-merges.sh
