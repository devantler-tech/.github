      )
    permissions:
      contents: read
    steps:
      - name: "\U0001F6E1️ Harden runner"
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: "\U0001F4D1 Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "\U0001F9F9 Free disk space"
        # Reclaim ~11+ GB by removing large preinstalled toolchains a Go
        # build/test never uses (Android SDK, .NET, GHC, …). A large consumer
        # module's `go build`/`go test ./...` build cache (and the coverage
        # job's `-race` binaries) can otherwise exhaust the runner disk —
        # observed as a hard "No space left on device" failure. Targeted
        # `rm -rf` only (avoids the slow apt-remove path); best-effort.
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /usr/local/share/powershell \
            /usr/share/miniconda || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free disk on /: ${before}G -> ${after}G (gained $((after - before))G)"
      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod
          cache: true
      - name: "\U0001F4E5 Restore kubeconform schema cache"
        # A consumer whose Go tests exercise kubeconform-based schema validation (e.g.
        # ksail's pkg/client/kubeconform) fetches JSON schemas from
        # raw.githubusercontent.com/yannh/kubernetes-json-schema on every cold run —
        # with no persistent cache across CI jobs, every job re-fetched every schema,
        # which is what tripped upstream 429 rate-limiting across the whole matrix
        # (portfolio-wide 2026-07-09 incident). This restores the local cache dir
        # ksail's own kubeconform client already builds via `validator.Opts.Cache` —
        # no consumer-side change needed; harmless no-op for repos that never
