      # commit was always a separate workflow step. Export that result as a patch instead, so
      # the credential that writes it is minted somewhere this job's PR-controlled linter
      # configuration cannot reach.
      #
      # Anchored at the repository ROOT on purpose: `git add .` is cwd-scoped and this job's
      # defaults.run.working-directory can be a nested module, which would silently drop any
      # untracked fix outside it. `git diff` emits root-relative paths regardless, which is what
      # apply-signed-fixes.yaml applies against.
      - name: "\U0001F4E5 Checkout fix exporter"
        if: ${{ !cancelled() && (success() || inputs.manual-workflow-fixes == true || inputs.manual-workflow-fixes == 'true') }}
        id: fix-exporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-actions
          persist-credentials: false
          sparse-checkout: .github/actions/prepare-fixes
      - name: "\U0001F4E6 Prepare and upload applied fixes"
        if: ${{ steps.fix-exporter.outcome == 'success' && !cancelled() && (success() || inputs.manual-workflow-fixes == true || inputs.manual-workflow-fixes == 'true') }}
        id: fixes
        uses: ./.devantler-tech-actions/.github/actions/prepare-fixes
        with:
          artifact-name: megalinter-fixes-${{ job.check_run_id }}
          upload-enabled: ${{ needs.changes.outputs.signed-fixes == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), github.event.pull_request.user.login) && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), inputs.pr-owner) }}
          mode: workflow
          manual-workflow-fixes: ${{ inputs.manual-workflow-fixes == true || inputs.manual-workflow-fixes == 'true' }}
      - name: ❌ Fail if uncommitted changes remain (read-only mode)
        if: ${{ steps.fixes.outputs.changed == 'true' && steps.fixes.outputs.upload-enabled != 'true' }}
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Auto-fix produced changes while signed fix commits are disabled for this run. Please run the fix locally and push."
            echo ""
            echo "Changed files:"
            git diff --stat
            echo ""
            echo "Full diff:"
            git diff
            exit 1
          fi
    env:
      GITHUB_TOKEN: ""
      GITHUB_COMMENT_REPORTER: false
      GITHUB_STATUS_REPORTER: false
  build:
    name: "\U0001F3D7️ Build"
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # Run when Go files change.
    if: |
      needs.changes.outputs.go == 'true'
    permissions:
      contents: read
    steps:
      - name: "\U0001F6E1️ Harden runner"
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: "\U0001F4D1 Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "\U0001F9F9 Free disk space"
        # Reclaim ~11+ GB by removing large preinstalled toolchains a Go
        # build/test never uses (Android SDK, .NET, GHC, …). A large consumer
        # module's `go build`/`go test ./...` build cache (and the coverage
        # job's `-race` binaries) can otherwise exhaust the runner disk —
        # observed as a hard "No space left on device" failure. Targeted
        # `rm -rf` only (avoids the slow apt-remove path); best-effort.
        run: |
          set -euo pipefail
          before=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /usr/local/share/powershell \
            /usr/share/miniconda || true
          after=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free disk on /: ${before}G -> ${after}G (gained $((after - before))G)"
      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod
          cache: true
      - name: "\U0001F6E0️ Build"
        run: go build -v ./...
  test:
    name: "\U0001F9EA Test"
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # Run for Go changes or an opted-in default-branch invocation.
    #
    # `needs.changes.outputs.go` answers "did a Go SOURCE file change", which is a strictly
    # narrower question than "could this suite's verdict have changed". A Go test may read a
    # non-Go file as its subject: ksail's `internal/ciharness` package asserts against
    # `.github/workflows/*.yaml` and `.github/scripts/*.sh`. A commit touching only those
    # files therefore yields `go == 'false'` CORRECTLY — the filter is not misconfigured —
