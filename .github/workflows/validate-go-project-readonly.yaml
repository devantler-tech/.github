# Generated by .github/scripts/generate-go-readonly.sh; do not edit.
name: ✅ Validate Go Project (Read-Only)
on:
  workflow_call:
    inputs:
      pr-owner:
        required: false
        type: string
        description: "Pull request author login (used to disable auto-commit for bot PRs)"
      manual-workflow-fixes:
        required: false
        type: boolean
        default: false
        description: "Prepare workflow-file fixes even after lint errors; patch upload is disabled and lint errors still fail."
      apply-signed-fixes:
        required: false
        type: boolean
        default: false
        description: "Ignored: this entrypoint never exports or applies signed fixes."
      working-directory:
        required: false
        type: string
        default: ""
        description: "Go module directory to validate. Empty = repo root (the normal consumer case); the CI self-test sets it to a fixture so this workflow can run in a repo that is not itself a Go module."
      go-memory-limit:
        required: false
        type: string
        default: "8GiB"
        description: "Soft Go heap limit for deadcode and vulnerability analysis. Lower it for smaller runners; decimal Go units are bounded to 8GiB. It does not cap total runner memory."
      test-default-branch:
        required: false
        type: boolean
        default: true
        description: "Run the Go test suite on every default-branch invocation, rather than only when the diff touched a Go file. `go` answers 'did a Go source file change', which is narrower than 'could the suite's verdict have changed': a Go test may read a non-Go file as its subject, so a commit touching only those files skips the suite while breaking it, and the default branch keeps reporting green. On by default, so a consumer inherits the corrected coverage without knowing this input exists; the default branch then reports whatever the suite actually says, which may be red. Set it to false only to accept a default branch whose green does not mean the suite ran (devantler-tech/ksail#6373)."
      maintenance-default-branch:
        required: false
        type: boolean
        default: false
        description: "Also run go mod tidy and dead-code analysis on default-branch pushes that change Go files. Opt-in and read-only: findings fail validation without pushing fixes to the default branch. Rollout and flag retirement: devantler-tech/actions#1170."
# Invocation-aware concurrency: two invocations that differ in any way are different
# logical invocations and must not cancel each other. Only reruns of the SAME invocation
# supersede. Two discriminators are needed, for two separate collisions both seen live:
#
#   * github.workflow — separates the org-required direct run (github.workflow == this
#     workflow's name) from a caller's reusable-workflow self-test (a reusable workflow
#     inherits the CALLER's github.workflow, e.g. the CI workflow). Without it both share
#     one group on the same repository+ref and cancel each other, failing the aggregate
#     required check nondeterministically (devantler-tech/actions#587).
#
#   * the invocation's inputs — separates two calls from the SAME caller workflow on the
#     same ref, which github.workflow alone cannot tell apart. The both-states self-tests
#     for `maintenance-default-branch` have that shape: the enabled and disabled
#     invocations must both complete.
#
#   * the run, on the default branch only — each default-branch run is the verification
#     record for its commit, so no run there may cancel another. The path filter looks
#     only at the latest push, so a cancelled run's build, lint and tidy checks would
#     never cover its commit while the branch still reports green (devantler-tech/ksail#6345).
#     A reusable workflow inherits the caller's run, so each caller run gets its own group.
#     Pull-request and merge-queue runs keep a shared group, so a superseded run still
#     cancels. test-validate-go-default-branch-concurrency.sh guards this.
#
# Adding a discriminator only ever splits groups further; it cannot merge two that were
# separate, so this direction of change cannot reintroduce #587.
concurrency:
  group: "validate-go-project-readonly-${{ github.repository }}-${{ github.ref }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || '' }}-${{ github.workflow }}-${{ inputs.pr-owner }}-${{ inputs.working-directory }}-${{ inputs.test-default-branch }}-${{ inputs.maintenance-default-branch }}-${{ inputs.apply-signed-fixes }}-${{ inputs.manual-workflow-fixes }}-${{ inputs.go-memory-limit }}"
  cancel-in-progress: true
permissions: {}
jobs:
  # Detect if Go files changed to conditionally skip jobs for non-Go changes
  changes:
    name: "\U0001F50D Detect Changes"
    runs-on: ubuntu-latest
    # Direct required runs skip this repository unless a fixture module is selected.
    # Skip merge queue — these checks already passed on the PR
    if: >-
      (inputs.working-directory != '' || github.repository != 'devantler-tech/.github') && github.event_name != 'merge_group'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      govulncheck: ${{ steps.filter.outputs.govulncheck }}
      lintable: ${{ steps.filter.outputs.lintable }}
      # One decision, read by every fixer lane and every apply job: are signed auto-fix commits
      # enabled for this invocation? A workflow_call caller answers through the input. The
      # org-required direct run cannot: outside workflow_call the `inputs` context is EMPTY, so
      # the input reads as null there and no default can reach it. That run is recognised by two
      # facts a called run never has at once: an empty inputs object (a call always carries its
      # declared inputs, defaults filled in) and its own path in the workflow ref (a called
      # workflow inherits the CALLER's ref). Both measured on #1129. The empty-inputs test is
      # what keeps a caller's explicit `apply-signed-fixes: false` honoured even if its wrapper
      # happens to share this file's path: null, false and '' all compare equal in an expression,
      # so no comparison on the input alone can tell absent from false.
      signed-fixes: "false"
    steps:
      - name: "\U0001F6E1️ Harden runner"
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: "\U0001F4C4 Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "\U0001F50D Filter paths"
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.golangci.yaml'
              - '**/go.mod'
              - '**/go.sum'
              - '**/.golangci.yml'
              - '**/.golangci.yaml'
            # The allowlist decides which advisories the vuln scan accepts, so a change to
            # it changes the gate's verdict on unchanged code: without this filter, editing
            # the allowlist skips the very scan that reads it.
            #
            # It is a filter of its OWN rather than an entry in `go:` on purpose. `go` is
            # consumed by go-mod-tidy, golangci-lint, deadcode, the test matrix and the
            # coverage upload as well; folding the allowlist into it would make an
            # allowlist-only commit run all of those in every consumer repo, so an
            # administrative risk-acceptance could be blocked by a pre-existing failure
            # somewhere else entirely. This output is OR-ed into the govulncheck job alone.
            #
            # Both forms are listed because `working-directory` may point at a nested
            # module, whose allowlist lives at e.g. `services/api/.govulncheck-allow.txt`
            # — a root-only pattern would leave that edit unscanned.
            govulncheck:
              - '.govulncheck-allow.txt'
              - '**/.govulncheck-allow.txt'
            # Files lintable by MegaLinter Go flavor (excluding Go files which are covered above)
            lintable:
              # Languages
              - '**/*.sh'
              - '**/*.bash'
              - '**/*.groovy'
              - '**/*.gradle'
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.sql'
              # Formats
              - '**/*.css'
              - '**/*.scss'
              - '**/*.env'
              - '.env*'
              - '**/*.graphql'
              - '**/*.gql'
              - '**/*.html'
              - '**/*.htm'
              - '**/*.json'
              - '**/*.md'
              - '**/*.markdown'
              - '**/*.proto'
              - '**/*.xml'
              - '**/*.yaml'
              - '**/*.yml'
              # Tooling formats
              - '.github/workflows/**'
              - '**/Dockerfile*'
              - '**/*.dockerfile'
              - '.editorconfig'
              - '**/Chart.yaml'
              - '**/values.yaml'
              - '**/templates/**/*.yaml'
              - '**/templates/**/*.yml'
              # Linter config files (changes to these should trigger linting)
              - '.mega-linter.yml'
              - '.mega-linter.yaml'
              - '.markdownlint.json'
              - '.markdownlint.yaml'
              - '.markdownlint.yml'
              - '.yamllint.yml'
              - '.yamllint.yaml'
              - '.hadolint.yaml'
              - '.hadolint.yml'
              - '.cspell.json'
              - 'cspell.json'
              - '.vale.ini'
              - '.prettierrc'
              - '.prettierrc.*'
              - 'lychee.toml'
              - '.ls-lint.yml'
              - '.secretlintrc.*'
              - '.gitleaksignore'
  tidy:
    name: "\U0001F4E6 Tidy"
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # Preserve feature-branch checks; default-branch pushes opt in to read-only
    # validation. Resolve the consumer's actual default branch, including trunk.
    if: |
      needs.changes.outputs.go == 'true'
      && github.event_name != 'merge_group'
      && (
        github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        || (
          github.event_name == 'push'
          && (inputs.maintenance-default-branch == true || inputs.maintenance-default-branch == 'true')
        )
      )
    outputs:
      fixes-created: ${{ steps.fixes.outputs.changed }}
      fixes-artifact: ${{ steps.fixes.outputs.artifact-name }}
    permissions:
      # `go mod tidy` resolves and downloads modules named by the pull request under review,
      # so this job holds no credential that can write to the branch. The commit is made on a
      # fresh runner by apply-signed-fixes.yaml.
      contents: read
    steps:
      - name: "\U0001F6E1️ Harden runner"
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: "\U0001F4C4 Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod
      - name: "\U0001F9F9 go mod tidy"
        run: go mod tidy
      # Anchored at the repository ROOT: `git add .` is cwd-scoped and this job's
      # defaults.run.working-directory can be a nested module.
      - name: "\U0001F4E5 Checkout fix exporter"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-actions
          persist-credentials: false
          sparse-checkout: .github/actions/prepare-fixes
      - name: "\U0001F4E6 Prepare and upload applied fixes"
        id: fixes
        uses: ./.devantler-tech-actions/.github/actions/prepare-fixes
        with:
          artifact-name: tidy-fixes-${{ job.check_run_id }}
          upload-enabled: ${{ needs.changes.outputs.signed-fixes == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), github.event.pull_request.user.login) && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), inputs.pr-owner) }}
      - name: ❌ Fail if uncommitted changes remain (read-only mode)
        if: ${{ steps.fixes.outputs.changed == 'true' && steps.fixes.outputs.upload-enabled != 'true' }}
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Auto-fix produced changes while signed fix commits are disabled for this run. Please run the fix locally and push."
            echo ""
            echo "Changed files:"
            git diff --stat
            echo ""
            echo "Full diff:"
            git diff
            exit 1
          fi
  golangci-lint:
    name: "\U0001F9F9 Lint - golangci-lint"
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # Run when Go files change.
    if: |
      needs.changes.outputs.go == 'true'
    outputs:
      fixes-created: ${{ steps.fixes.outputs.changed }}
      fixes-artifact: ${{ steps.fixes.outputs.artifact-name }}
    permissions:
      # golangci-lint's configuration comes from the pull request under review, so this job
      # holds no credential that can write to the branch. The commit is made on a fresh
      # runner by apply-signed-fixes.yaml.
      contents: read
    steps:
      - name: "\U0001F6E1️ Harden runner"
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: "\U0001F4C4 Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod
      - name: "\U0001F9F9 Run golangci-lint"
        id: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          working-directory: ${{ inputs.working-directory || '.' }}
          args: --fix
          # Skip the action's `config verify` step: it fetches the golangci-lint
          # JSONSchema over the network (golangci-lint.run), which intermittently
          # times out ("context deadline exceeded") and fails the lint job. The
          # config is still validated at runtime by `golangci-lint run`.
          verify: false
      # Anchored at the repository ROOT: `git add .` is cwd-scoped and this job's
      # defaults.run.working-directory can be a nested module.
      - name: "\U0001F4E5 Checkout fix exporter"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-actions
          persist-credentials: false
          sparse-checkout: .github/actions/prepare-fixes
      - name: "\U0001F4E6 Prepare and upload applied fixes"
        id: fixes
        uses: ./.devantler-tech-actions/.github/actions/prepare-fixes
        with:
          artifact-name: golangci-lint-fixes-${{ job.check_run_id }}
          upload-enabled: ${{ needs.changes.outputs.signed-fixes == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), github.event.pull_request.user.login) && !contains(fromJSON('["dependabot[bot]","dependabot","renovate[bot]","renovatebot","renovate"]'), inputs.pr-owner) }}
      - name: ❌ Fail if uncommitted changes remain (read-only mode)
        if: ${{ steps.fixes.outputs.changed == 'true' && steps.fixes.outputs.upload-enabled != 'true' }}
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Auto-fix produced changes while signed fix commits are disabled for this run. Please run the fix locally and push."
            echo ""
            echo "Changed files:"
            git diff --stat
            echo ""
            echo "Full diff:"
            git diff
            exit 1
          fi
  deadcode:
    name: "\U0001F50D Dead Code Analysis"
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # Keep pull-request coverage; add default-branch pushes only after opt-in.
    if: |
      needs.changes.outputs.go == 'true'
      && (
        github.event_name == 'pull_request'
        || (
          github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && (inputs.maintenance-default-branch == true || inputs.maintenance-default-branch == 'true')
        )
      )
    permissions:
      contents: read
    # `deadcode -test ./...` builds a whole-program SSA call graph in memory (same shape
    # as govulncheck below), whose peak grows with the module's dependency graph. On large
    # modules (ones importing Kubernetes / Flux / Talos clients) the peak exhausts the
    # hosted runner's RAM, which the host resolves by killing the runner mid-analysis
    # (exit 143 / "runner has received a shutdown signal") — an opaque, retry-resistant
    # failure, not a real dead-code finding. GOMEMLIMIT caps the Go runtime's heap so the
    # GC reclaims aggressively and stays under the host ceiling instead of OOM-killing;
    # timeout-minutes bounds the worst case to a clear, fast failure rather than a hung
    # runner. GOMEMLIMIT is a SOFT limit governing only the Go runtime, so on the 16 GB
    # ubuntu-latest a public repository gets, it must leave room for what it does not cover
    # (runner agent, harden-runner, go subprocesses). A private repository's ubuntu-latest
    # has 8 GB, which this value already exceeds, so such a consumer needs a larger runner
    # or a lower cap. Guarded by test-govulncheck-timeout.
    timeout-minutes: 15
    env:
      GOMEMLIMIT: 8GiB
      GO_MEMORY_LIMIT: ${{ toJSON(inputs) == '{}' && '8GiB' || inputs.go-memory-limit }}
    steps:
      - name: "\U0001F6E1️ Harden runner"
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: "\U0001F4C4 Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout the analysis helper at this workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-actions
          persist-credentials: false
      - name: Validate the Go analysis memory limit
        id: memory-limit
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.devantler-tech-actions/.github/scripts/validate-go-memory-limit.sh" "$GO_MEMORY_LIMIT" 8
          printf 'GOMEMLIMIT=%s\n' "$GO_MEMORY_LIMIT" >> "$GITHUB_ENV"
      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod
          cache: true
      - name: "\U0001F4E5 Install deadcode"
        # Bounded retry so a transient module-proxy 5xx / network blip on this
        # required-check path can't red the gate (reliability invariant — #305).
        # go install is idempotent, so re-running it is always safe.
        run: |
          for attempt in 1 2 3; do
            if go install golang.org/x/tools/cmd/deadcode@v0.50.0; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::deadcode install failed (attempt ${attempt}/3); retrying in $((attempt * 5))s..."
              sleep "$((attempt * 5))"
            fi
          done
          echo "::error::Failed to install deadcode after 3 attempts."
          exit 1
      - name: "\U0001F50D Check for dead code"
        run: |
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT

          deadcode -test ./... >"$output_file"

          if [ -s "$output_file" ]; then
            echo "::error::Dead code detected. Remove unreachable functions before merging."
            cat "$output_file"
            exit 1
          fi
          echo "No dead code found ✅"
  govulncheck:
    name: "\U0001F6E1️ Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # A vulnerability scan's verdict depends on the vulnerability DATABASE as well as the
    # diff: an advisory published after a merge makes unchanged, already-merged code
    # vulnerable. Two separate conditions each hid that on the default branch —
    # `event_name == 'pull_request'` meant it never scanned at all, and the path filter
    # alone means a push touching no Go path (a README edit) skips the scan, so the branch
    # keeps reporting green while a newly-published advisory already applies to it.
    #
    # The two arms, and why each is shaped this way:
    #
    #   * PULL-REQUEST ARM — Go-source or allowlist changes trigger the scan.
    #     The dedicated allowlist filter leaves tidy, lint, deadcode and tests unchanged.
    #
    #   * DEFAULT-BRANCH ARM — scan after change detection, independently of its diff.
    #     A nonempty Go output proves the filter ran; default-branch scanning covers
    #     newly published advisories even when this invocation changes no Go files.
    if: |
      ((
        (
          needs.changes.outputs.go == 'true'
          || needs.changes.outputs.govulncheck == 'true'
        )
        && github.event_name == 'pull_request'
      ) || (
        needs.changes.outputs.go != ''
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      ))
    permissions:
      contents: read
    # govulncheck's default symbol scan builds a whole-program call graph in memory,
    # whose peak grows with the module's dependency graph. On large modules (e.g. ones
    # importing Kubernetes / Flux / Talos clients) it can exhaust the hosted runner's RAM,
    # which the host resolves by killing the runner mid-scan (exit 143 / "runner has
    # received a shutdown signal") — an opaque, retry-resistant failure. GOMEMLIMIT caps
    # the Go runtime's heap so the GC reclaims aggressively and stays under the host
    # ceiling instead of OOM-killing; timeout-minutes bounds the worst case to a clear,
    # fast failure rather than a hung runner.
    #
    # The deadline lives on the scan STEP, not only the job (#1097). A job that hits its own
    # timeout-minutes ends `cancelled`, and a cancelled required check is terminal: Dependabot
    # never reruns it and auto-merge waits forever, so one slow scan stalled a bot PR until
    # someone noticed. Each scan attempt therefore gets 24 minutes — about 1.3× the slowest
    # measured successful scan (it passed 18m54s into a ksail job on 2026-09-06, and 17m44s
    # into a KSail main run; 14 recent ksail jobs took 11–16 min end to end) — and a timeout,
    # and only a timeout, earns exactly one retry. The job ceiling stays finite but covers two
    # attempts plus checkout and setup-go's post-job cache save (measured 6m07s after that
    # 2026-09-06 scan): 2 × 24 + 10 = 58,
    # rounded to 60. Below that the job cap would pre-empt the retry and end the run
    # `cancelled` again. Guarded by test-govulncheck-timeout and test-govulncheck-timeout-retry.
    timeout-minutes: 60
    env:
      # ubuntu-latest provides 16 GB RAM to a public repository and 8 GB to a private one;
      # this value is sized for the public ceiling and already exceeds the private one, so
      # such a consumer needs a larger runner or a caller-side cap below it. Documented at
      # docs.github.com/en/actions/reference/runners/github-hosted-runners, whose standard
      # runner tables differ by repository visibility.
      # GOMEMLIMIT is a SOFT limit that governs only
      # the Go runtime, so the value must leave room for everything it does not cover (the
      # runner agent, harden-runner, and the go subprocesses this job spawns); above ~half
      # the host the process grows until total RSS crosses the ceiling and the HOST kills
      # the runner mid-scan with an opaque exit 143. Guarded by test-govulncheck-timeout.
      GOMEMLIMIT: 8GiB
      GO_MEMORY_LIMIT: ${{ toJSON(inputs) == '{}' && '8GiB' || inputs.go-memory-limit }}
    steps:
      - name: "\U0001F6E1️ Harden runner"
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: "\U0001F4C4 Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Resolve the scanner and allowlist evaluator from this workflow's exact
      # commit. The caller's checkout remains the module being scanned.
      - name: "\U0001F4E5 Checkout the shared scanner"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-actions
          persist-credentials: false
      # Only reachable symbols block. A committed allowlist accepts exactly the
      # listed advisory IDs; operational errors always fail the check.
      - name: Validate the Go analysis memory limit
        id: memory-limit
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/.devantler-tech-actions/.github/scripts/validate-go-memory-limit.sh" "$GO_MEMORY_LIMIT" 8
          printf 'GOMEMLIMIT=%s\n' "$GO_MEMORY_LIMIT" >> "$GITHUB_ENV"
      - name: "\U0001F50E Detect govulncheck allowlist"
        id: govulncheck-allow
        run: |
          if [ -f .govulncheck-allow.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # Start of the first scan attempt, so the classifier below can tell a scan that ran out
      # of time from one that failed on its own (see the job's timeout-minutes comment).
      - name: ⏱️ Record vulnerability scan start
        id: scan-clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      # continue-on-error lets the classifier see this attempt's outcome; it never lets a
      # failure through, because the classifier fails the job on anything but a timeout.
      - name: "\U0001F6E1️ Scan for known vulnerabilities"
        id: scan
        continue-on-error: true
        timeout-minutes: 24
        # Keep exact-commit checkout until actionlint supports $/ (#1234).
        uses: ./.devantler-tech-actions/.github/actions/govulncheck # zizmor: ignore[self-repository]
        with:
          work-dir: ${{ inputs.working-directory || '.' }}
          # No stable-channel override: scan using the version the caller ships.
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod
          # uses: inputs stay checkout-root-relative, including nested modules.
          allow-file: ${{ steps.govulncheck-allow.outputs.present == 'true' && format('{0}/.govulncheck-allow.txt', inputs.working-directory || '.') || '' }}
      # A timed-out step is reported as a failure, exactly like a reachable advisory, so the
      # elapsed time is what tells them apart: only an attempt that reached its deadline is
      # retried. A finding or an operational error fails the job here, before any retry, so the
      # gate stays exactly as strict. Unreadable timing fails closed rather than retrying.
      #
      # A step timeout signals only the step's own shell, so the scanner it started keeps running
      # as an orphan until the job ends (the live test observes this). Left alone it would scan
      # beside the retry, doubling the memory GOMEMLIMIT keeps under half the host and slowing the
      # attempt that is meant to finish, so the timed-out scanner is stopped before the retry.
      - name: "\U0001F501 Retry the scan only if it ran out of time"
        id: scan-timeout
        if: ${{ steps.scan.outcome != 'success' }}
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          STARTED: ${{ steps.scan-clock.outputs.started }}
          TIMEOUT_MINUTES: 24
          SCAN_PROCESS: govulncheck
        run: |
          set -euo pipefail
          if [[ ! "$STARTED" =~ ^[0-9]+$ || ! "$TIMEOUT_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "::error::Cannot tell whether the vulnerability scan timed out (start '$STARTED', limit '$TIMEOUT_MINUTES'); failing instead of retrying."
            exit 1
          fi
          # pgrep/pkill -x match the kernel's 15-character process name.
          if [[ ! "$SCAN_PROCESS" =~ ^[A-Za-z0-9._-]{1,15}$ ]]; then
            echo "::error::Cannot identify the scanner process to stop (SCAN_PROCESS '$SCAN_PROCESS'); failing instead of retrying."
            exit 1
          fi
          elapsed=$(( $(date +%s) - STARTED ))
          if (( elapsed >= TIMEOUT_MINUTES * 60 )); then
            if pkill -TERM -x "$SCAN_PROCESS"; then
              sleep 5
              pkill -KILL -x "$SCAN_PROCESS" || true
              echo "Stopped the timed-out ${SCAN_PROCESS} before retrying."
            fi
            echo "::warning::The vulnerability scan ran out of time after ${elapsed}s (limit ${TIMEOUT_MINUTES} min), so it is retried once. A second timeout fails this check."
            echo "retry=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::The vulnerability scan ended '$OUTCOME' after ${elapsed}s, before its ${TIMEOUT_MINUTES}-minute limit: it reported findings or failed for another reason (see the scan step above), so it is not retried."
          exit 1
      # Identical to the scan above (test-govulncheck-timeout-retry keeps uses/with/timeout in
      # lockstep), without continue-on-error: a second timeout or any failure fails the check.
      - name: "\U0001F6E1️ Scan for known vulnerabilities (retry after timeout)"
        if: ${{ steps.scan-timeout.outputs.retry == 'true' }}
        timeout-minutes: 24
        # Keep exact-commit checkout until actionlint supports $/ (#1234).
        uses: ./.devantler-tech-actions/.github/actions/govulncheck # zizmor: ignore[self-repository]
        with:
          work-dir: ${{ inputs.working-directory || '.' }}
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod
          allow-file: ${{ steps.govulncheck-allow.outputs.present == 'true' && format('{0}/.govulncheck-allow.txt', inputs.working-directory || '.') || '' }}
  lint:
    name: "\U0001F9F9 Lint - mega-linter"
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    # Run if Go files OR other lintable files changed (markdown, yaml, json, etc.)
    if: |
      (needs.changes.outputs.go == 'true' || needs.changes.outputs.lintable == 'true')
    outputs:
      fixes-created: ${{ steps.fixes.outputs.changed == 'true' && steps.fixes.outputs.manual-required == 'false' }}
