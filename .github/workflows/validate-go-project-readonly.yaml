          persist-credentials: false
      - name: ⚙️ Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory || '.' }}/go.mod
      # Keep this `uses:` in lockstep with lint.yaml's MegaLinter step so both consumers run
      # the same image and the failure-mode self-test always exercises the real gate.
      - name: "\U0001F9F9 Lint"
        id: ml
        uses: oxsecurity/megalinter/flavors/go@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
        env:
          DEFAULT_WORKSPACE: ${{ inputs.working-directory || '.' }}
          MEGALINTER_CONFIG: ${{ github.workspace }}/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: true
          APPLY_FIXES: all
          APPLY_FIXES_EVENT: all
          APPLY_FIXES_MODE: commit
          # actionlint (<=1.7.12, bundled in MegaLinter) doesn't yet know the `code-quality`
          # permission scope that GitHub Code Quality coverage requires callers to grant, so it
          # reports a false "unknown permission scope" error. Ignore it until actionlint catches up.
          # It also rejects the documented `concurrency.queue` key as "unexpected key", which would
          # fail every consumer that serializes runs with `queue: max`. That one message is ignored
          # by a space-free pattern (safe for MegaLinter's argument split); any other unexpected
          # concurrency key is still reported. Keep in lockstep with lint.yaml
          # (test-actionlint-arguments-lockstep.sh).
          ACTION_ACTIONLINT_ARGUMENTS: -ignore code-quality -ignore unexpected.key..queue..for..concurrency..section
