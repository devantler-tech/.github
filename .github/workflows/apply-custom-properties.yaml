name: Apply organization custom-property schema

# Repository values are Crossplane resources in deploy/repository-properties/.
# The installed GitHub provider has no organization-schema resource (.github#773).
on:
  push:
    branches: [main]
    paths:
      - custom-properties/**
      - scripts/custom-properties/**
      - scripts/generate-repository-properties.sh
      - .github/workflows/apply-custom-properties.yaml
  schedule:
    - cron: "55 5 * * *"
  workflow_dispatch: {}

permissions: {}
concurrency:
  group: apply-organization-custom-properties
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'devantler-tech/.github'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # proves this workflow's identity to the GitHub token broker
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Checkout reviewed workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: scripts/custom-properties/go.mod
          cache: false
      - name: Check reviewed declarations before obtaining authority
        env:
          GOTOOLCHAIN: local
        run: go -C scripts/custom-properties run . --root ../.. --check
      # Both tokens come from the GitHub token broker (devantler-tech/monorepo
      # ADR 0020), each through its own reviewed policy in .github/chainguard/.
      # No App key is read, and each action's post step revokes its token.
      # Neither names an App, so the broker mints each from either botantler App.
      #
      # The read-back token is read only: organization property values and
      # repository metadata across the organization. A token limited to the
      # catalogue is refused while a declared repository is not created yet,
      # which stops the schema reaching GitHub (maintainer direction
      # 2026-11-13). The reconciler fails closed unless the installation covers
      # all repositories and its listing is complete.
      - name: Get read-only portfolio property token
        id: readback-token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: sts.platform.devantler.tech
          scope: devantler-tech
          identity: apply-custom-properties-readback
      # GitHub requires organization administration write even for GET of org
      # rulesets and Actions policies. Only the guarded disabled legacy Copilot
      # policy may be retired. Scoped to this repository.
      - name: Get narrowly scoped organization token
        id: token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: sts.platform.devantler.tech
          scope: devantler-tech
          identity: apply-custom-properties
      - name: Reconcile schema after complete native consumer checks
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_PROPERTY_READBACK_TOKEN: ${{ steps.readback-token.outputs.token }}
          GOTOOLCHAIN: local
        run: go -C scripts/custom-properties run . --root ../.. --apply-schema
