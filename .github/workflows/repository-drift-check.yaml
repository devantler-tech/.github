name: 🔍 Repository drift check

# Fails when a repository setting declared in deploy/ disagrees with the live
# repository on GitHub.
#
# Cluster state cannot answer this on its own: a Repository managed resource
# only issues an update PATCH when it has a pending diff, so one that writes
# nothing — because it is Observe-only, or because its writes are rejected —
# reports Synced=ReconcileSuccess indefinitely while its declaration goes
# unapplied. Comparing the two ends directly is what catches that.
#
# It reports the state of the live org, which no individual PR controls, so it
# belongs on a schedule and must never gate a merge.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# The report job opens or closes one tracking issue from the run's outcome, so
# runs finish in start order: an older failure must never reopen the issue
# after a newer success closed it. Queue rather than cancel, so no scheduled
# result is discarded.
concurrency:
  group: repository-drift-check-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  repository-drift-check:
    name: 🔍 Repository drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The token has to reach every repository the check reads, and no more.
      # Deriving the list from deploy/ — the same source the check itself reads
      # — is what keeps those two in step; a hand-maintained list here would be
      # one more declaration that can silently go stale, which is the very thing
      # this workflow exists to catch.
      - name: 🎯 Resolve the repositories to read
        id: targets
        run: |
          # Without pipefail a failed render still exits 0 through the pipe, and
          # the emptiness guard below would be the only thing standing between
          # that and a token scoped to nothing.
          set -euo pipefail
          targets="$(
            kubectl kustomize deploy |
              yq -N '
                select(.kind == "Repository") |
                (.metadata.annotations["crossplane.io/external-name"] // .metadata.name)
              ' | paste -sd, -
          )"
          [ -n "$targets" ] || { echo "deploy/ declares no repositories" >&2; exit 1; }
          echo "list=$targets" >>"$GITHUB_OUTPUT"

      - name: 🔑 Get GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege scope (zizmor github-app): read-only, and only over
          # the declared repositories. The workflow's own GITHUB_TOKEN cannot be
          # used instead — it reaches this repository alone, and the org has a
          # private repository it could not see either way.
          #
          # An installation token's REST response can omit merge-policy fields
          # even with administrative read. The comparison fills only missing
          # declared settings from GraphQL and verifies both reads identify the
          # same repository before comparing them.
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.targets.outputs.list }}
          permission-metadata: read

      - name: 🔍 Compare declared and live repository settings
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/check-repository-drift.sh

  # The daily schedule is the only thing that runs this check, and nothing else
  # reads its results, so a red run stays invisible: it once failed eleven
  # scheduled runs in a row before anyone noticed. Mirror the outcome into one
  # tracking issue instead: a failing scheduled or dispatched run on main opens
  # or updates it, and the next passing one closes it.
  report-drift-check:
    name: 📣 Report the drift check result
    needs: [repository-drift-check]
    if: >-
      !cancelled()
      && github.repository == 'devantler-tech/.github'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      issues: write # open, update, or close the tracking issue
    steps:
      - name: 📣 Open or update the tracking issue
        if: needs.repository-drift-check.result != 'success'
        uses: devantler-tech/actions/upsert-issue@da153eb43b8333f13094abb151a48dc11e431988 # v13.7.4
        with:
          title: "Scheduled repository drift check is failing on main"
          body: |
            The `🔍 Repository drift check` run below did not pass on `main`.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Result: `${{ needs.repository-drift-check.result }}`

            Read the failing step first. A failure at `🔑 Get GitHub App Token` means the App credential needs attention. A `DRIFT` line from the compare step means a declared repository setting never reached the live repository: fix the resource in `deploy/`, never the live repository. This issue is updated by every failing run and closed by the next passing one.
      - name: ✅ Close the tracking issue
        if: needs.repository-drift-check.result == 'success'
        uses: devantler-tech/actions/upsert-issue@da153eb43b8333f13094abb151a48dc11e431988 # v13.7.4
        with:
          title: "Scheduled repository drift check is failing on main"
          open: "false"
          body: "The scheduled repository drift check passes on main."
          close-comment: "✅ ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} passed on `main`, so the repository drift check is green again. Closing."
