# Generated by .github/scripts/generate-cleanup-readonly.sh; do not edit.
name: "\U0001F5D1️ Delete Workflow Runs (Read-Only)"
on:
  workflow_call:
    inputs:
      repository:
        description: "Repository to target for workflow run deletion (defaults to the calling repository)"
        required: false
        type: string
      days:
        description: "Days-worth of runs to keep for each workflow"
        required: false
        default: 30
        type: number
      minimum-runs:
        description: "Minimum runs to keep for each workflow"
        required: false
        default: 6
        type: number
      delete-workflow-pattern:
        description: "Name or filename of the workflow (if not set, all workflows are targeted)"
        required: false
        type: string
      delete-workflow-by-state-pattern:
        description: |
          Filter workflows by state:
            - ALL, active, deleted, disabled_fork, disabled_inactivity, disabled_manually
          Accepts a comma-separated list of states.
        required: false
        default: "ALL"
        type: string
      delete-run-by-conclusion-pattern:
        description: |
          Remove runs based on conclusion:
            - ALL, action_required, cancelled, failure, skipped, success
          Accepts a comma-separated list of conclusions.
        required: false
        default: "ALL"
        type: string
      dry-run:
        description: "Logs simulated changes, no deletions are performed"
        required: false
        default: true
        type: boolean
permissions: {}
jobs:
  delete-runs:
    name: Delete workflow runs
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: "\U0001F6E1️ Harden runner"
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: "\U0001F4E5 Checkout this workflow's commit"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .devantler-tech-actions
          persist-credentials: false
      - name: "\U0001F439 Setup Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .devantler-tech-actions/.github/scripts/delete-workflow-runs/go.mod
          cache: false
      - name: "\U0001F5D1️ Delete workflow runs"
        env:
          CLEANUP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REPOSITORY: ${{ inputs.repository || github.repository }}
          INPUT_RETAIN_DAYS: ${{ inputs.days }}
          INPUT_KEEP_MINIMUM_RUNS: ${{ inputs.minimum-runs }}
          INPUT_DELETE_WORKFLOW_PATTERN: ${{ inputs.delete-workflow-pattern }}
          INPUT_DELETE_WORKFLOW_BY_STATE_PATTERN: ${{ inputs.delete-workflow-by-state-pattern }}
          INPUT_DELETE_RUN_BY_CONCLUSION_PATTERN: ${{ inputs.delete-run-by-conclusion-pattern }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: go run .devantler-tech-actions/.github/scripts/delete-workflow-runs/main.go
