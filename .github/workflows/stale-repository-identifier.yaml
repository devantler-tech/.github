name: 🧹 Stale repository identifier

on:
  workflow_dispatch:
  schedule:
    - cron: "3 2 1 * *"

permissions:
  contents: read
  issues: write
  # Proves this workflow's identity to the GitHub token broker.
  id-token: write

jobs:
  stale-repository-identifier:
    name: 🧹 Stale repository identifier
    runs-on: ubuntu-latest
    steps:
      # The GitHub token broker (devantler-tech/monorepo ADR 0020) exchanges this
      # workflow's OIDC token for a read-only organization token, as granted by
      # .github/chainguard/stale-repository-identifier.sts.yaml. No App key is
      # read here, and the action's post step revokes the token. stale-repos only
      # reads repository, pull request and release activity; the report issue is
      # written with the workflow's own token below.
      - name: 🔑 Get a read-only organization token from the token broker
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: app-token
        with:
          domain: sts.platform.devantler.tech
          scope: devantler-tech
          identity: stale-repository-identifier

      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: 🧹 Identify stale repositories
        # github/stale-repos v9.1.1 (07243c72) is a Docker action whose metadata runs
        # the floating `stale_repos:v9` tag, so its SHA pin froze nothing while this
        # step holds the App token (#627). Run the same image by digest instead; the
        # action declares no inputs or entrypoint, so the step behaves the same.
        # Refresh path: .github/version-pins.json.
        uses: docker://ghcr.io/github-community-projects/stale_repos:v9.1.1@sha256:b259f6c3d90e6e29c7d9a0644f4bf7b4004f51e08184cb3f834e98dc56de5745
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXEMPT_TOPICS: "keep,template"
          INACTIVE_DAYS: 365
          ADDITIONAL_METRICS: "release,pr"
          ORGANIZATION: devantler-tech

      - name: 🔎 Check for the stale report issue
        run: |
          ISSUE_NUMBER=$(gh search issues "Stale-repository-report" --match title --json number --jq ".[0].number")
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📄 Create or update stale report issue
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          issue-number: ${{ env.issue_number }}
          title: 📄 Stale repository report
          content-filepath: ./stale_repos.md
          assignees: devantler
          token: ${{ secrets.GITHUB_TOKEN }}
