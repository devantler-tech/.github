name: 🧹 Stale repository identifier

on:
  workflow_dispatch:
  schedule:
    - cron: "3 2 1 * *"

permissions:
  contents: read
  issues: write

jobs:
  stale-repository-identifier:
    name: 🧹 Stale repository identifier
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Get GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Least-privilege scope (zizmor github-app): without these the token
          # inherits all of the App's installation permissions. stale-repos only
          # reads repo/PR/release activity and opens a report issue.
          permission-contents: read
          permission-pull-requests: read
          permission-issues: write

      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: 🧹 Identify stale repositories
        # github/stale-repos v9.1.1 (07243c72) is a Docker action whose metadata runs
        # the floating `stale_repos:v9` tag, so its SHA pin froze nothing while this
        # step holds the App token (#627). Run the same image by digest instead; the
        # action declares no inputs or entrypoint, so the step behaves the same.
        # Refresh path: .github/version-pins.json.
        uses: docker://ghcr.io/github-community-projects/stale_repos:v9.1.1@sha256:b259f6c3d90e6e29c7d9a0644f4bf7b4004f51e08184cb3f834e98dc56de5745
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXEMPT_TOPICS: "keep,template"
          INACTIVE_DAYS: 365
          ADDITIONAL_METRICS: "release,pr"
          ORGANIZATION: devantler-tech

      - name: 🔎 Check for the stale report issue
        run: |
          ISSUE_NUMBER=$(gh search issues "Stale-repository-report" --match title --json number --jq ".[0].number")
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📄 Create or update stale report issue
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          issue-number: ${{ env.issue_number }}
          title: 📄 Stale repository report
          content-filepath: ./stale_repos.md
          assignees: devantler
          token: ${{ secrets.GITHUB_TOKEN }}
