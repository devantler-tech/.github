name: 📦 Publish App
on:
  workflow_call:
    inputs:
      app-name:
        description: "Container name in the deployment manifest to pin to the built image digest."
        required: true
        type: string
      deploy-path:
        description: "Path to the Kubernetes manifests directory packaged as the OCI artifact."
        required: false
        default: ./deploy
        type: string
      dry-run:
        description: "Skip publish (validate workflow interface only)."
        required: false
        default: false
        type: boolean
      enable-caller-pin:
        description: "Enforce that the caller pinned this workflow to a commit SHA before signing. Opt-in while rolling out; see AGENTS.md 'Shipping a new capability behind an opt-in flag'."
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  publish:
    name: Publish image & manifests
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push image + manifests OCI artifact
      id-token: write # keyless cosign signing (Fulcio/Rekor via GitHub OIDC)
    env:
      REGISTRY: ghcr.io # auth uses GITHUB_TOKEN, which is GHCR-scoped
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 🔒 Require a semantic-version tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # The WHOLE tag must be a SemVer 2.0.0 version behind a `v`, not merely start with one:
          # `v1.2.3garbage` would otherwise publish as `1.2.3garbage`, which neither Flux's semver
          # selection nor docker/metadata-action treats as a version. Refused here, before anything
          # reaches the registry. Keep this step identical in publish-app and publish-manifests.
          set -euo pipefail
          export LC_ALL=C
          num='(0|[1-9][0-9]*)'
          pre='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          build='[0-9A-Za-z-]+'
          semver="^v${num}\.${num}\.${num}(-${pre}(\.${pre})*)?(\+${build}(\.${build})*)?$"
          if [ "$REF_TYPE" != "tag" ] || ! [[ "$REF_NAME" =~ $semver ]]; then
            echo "::error::publish-app must be invoked from a semantic-version tag vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD] (got $REF_TYPE/$REF_NAME); releases are tagged and selected by semantic version."
            exit 1
          fi
          # An OCI tag cannot carry `+`, and SemVer ignores build metadata when ordering versions, so
          # publish without it — the same version docker/metadata-action derives for an image tag.
          version="${REF_NAME#v}"
          version="${version%%+*}"
          # Refuse what the parsers downstream cannot read or order either: docker/metadata-action's
          # takes at most 256 characters and numbers below 2^53, Flux's numbers below 2^64, and both
          # compare a longer numeric pre-release identifier as text. 15 digits always fit.
          numbers=".${version%%-*}."
          case "$version" in *-*) numbers="${numbers}${version#*-}." ;; esac
          too_long='\.[0-9]{16,}\.'
          if [ "${#REF_NAME}" -gt 256 ] || [[ "$numbers" =~ $too_long ]]; then
            echo "::error::publish-app refuses tag $REF_NAME: it must be at most 256 characters with numbers of at most 15 digits, so every tool downstream can read and order the version."
            exit 1
          fi
          if [ "${#version}" -gt 128 ]; then
            echo "::error::publish-app refuses tag $REF_NAME: version '$version' is longer than the 128 characters an OCI tag allows."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 🔎 Resolve the calling ref from the OIDC claim
        id: caller
        if: ${{ inputs.enable-caller-pin }}
        run: |
          # github.job_workflow_ref is NOT exposed in the expression context — measured empty inside
          # a called reusable workflow, while github.workflow_ref (the caller's own entry workflow)
          # resolves fine. The value that actually reaches the cosign certificate's SAN is the OIDC
          # token's job_workflow_ref claim, so read it from the token: same source, same value.
          token="$(curl -fsS --max-time 10 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -r '.value')"
          payload="$(printf '%s' "$token" | cut -d. -f2)"
          case $((${#payload} % 4)) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          ref="$(printf '%s' "$payload" | tr '_-' '/+' | base64 -d | jq -r '.job_workflow_ref // ""')"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: 🔒 Require a SHA-pinned caller
        if: ${{ inputs.enable-caller-pin }}
        env:
          JOB_WORKFLOW_REF: ${{ steps.caller.outputs.ref }}
        run: |
          # This job mints a keyless cosign certificate whose SAN is this workflow's own
          # job_workflow_ref, and the cluster's trust rules verify signatures against it. A branch
          # or tag ref would let a superseded revision of this workflow mint a signature the
          # cluster still trusts, so require the one ref form that cannot move: a commit SHA.
          ref="${JOB_WORKFLOW_REF##*@}"
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::publish-app must be called by a 40-character commit SHA, not '@${ref}'. Pin the caller as devantler-tech/.github/.github/workflows/publish-app.yaml@<sha> (Renovate keeps that pin current)."
            exit 1
          fi

      - name: 📑 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Validate the deployment manifest
        env:
          APP_NAME: ${{ inputs.app-name }}
          DEPLOY_PATH: ${{ inputs.deploy-path }}
        run: |
          # Every manifest check runs here, before anything reaches the registry. A release that fails
          # after the image push leaves GHCR changed — `latest` included — with no deployable manifest
          # to go with the image. Only the digest injection waits for the build, because the digest
          # does not exist before it.
          set -euo pipefail
          file="${DEPLOY_PATH}/deployment.yaml"
          if [ ! -f "$file" ]; then
            echo "::error::manifest $file not found (check the deploy-path input)"; exit 1
          fi
          matches=$(yq '[.spec.template.spec.containers[] | select(.name == strenv(APP_NAME))] | length' "$file")
          if [ "$matches" != "1" ]; then
            echo "::error::expected exactly one container named '$APP_NAME' in $file, found $matches"; exit 1
          fi

      # Installed before anything is pushed, so a failed download also fails the job while the
      # registry is still untouched.
      - name: ⚙️ Setup Flux CLI
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5

      - name: ✍️ Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 🔐 Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.GH_TOKEN }}

      - name: 🏷️ Derive image tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest

      - name: 🐳 Build & push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 📌 Pin image digest in manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          APP_NAME: ${{ inputs.app-name }}
          DEPLOY_PATH: ${{ inputs.deploy-path }}
        run: |
          # The manifest was validated before the build; this step only injects the digest the build
          # produced, and checks that the injection took. A registry reference must be lowercase,
          # which is also how docker/metadata-action named the image it pushed.
          set -euo pipefail
          IMAGE="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          file="${DEPLOY_PATH}/deployment.yaml"
          if [ -z "$DIGEST" ]; then
            echo "::error::build did not produce an image digest"; exit 1
          fi
          yq -i '(.spec.template.spec.containers[] | select(.name == strenv(APP_NAME)).image) = strenv(IMAGE) + "@" + strenv(DIGEST)' "$file"
          grep -qF "${IMAGE}@${DIGEST}" "$file" || { echo "::error::image pin did not apply to $file"; exit 1; }

      - name: 📦 Push & sign manifests artifact
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DEPLOY_PATH: ${{ inputs.deploy-path }}
          VERSION: ${{ steps.version.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${VERSION:?the semantic-version tag step did not resolve a version}"
          # A registry reference must be lowercase, as docker/metadata-action named the image.
          IMAGE="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          ARTIFACT="$(printf '%s' "${REGISTRY}/${IMAGE_NAME}/manifests" | tr '[:upper:]' '[:lower:]')"
          # Sign the digest this push produced, never the tag re-resolved later: a tag
          # moved by an overlapping release or another writer would otherwise get a
          # signature over bytes this run did not publish.
          PUSHED="$(flux push artifact "oci://${ARTIFACT}:${VERSION}" \
            --path="${DEPLOY_PATH}" \
            --source="${SERVER_URL}/${REPOSITORY}" \
            --revision="${REF_NAME}@sha1:${SHA}" \
            --creds "${ACTOR}:${GH_TOKEN}" \
            --output json)"
          ARTIFACT_DIGEST="$(printf '%s' "$PUSHED" | jq -r '.digest // ""')"
          if ! printf '%s' "$ARTIFACT_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::flux push did not report the pushed artifact digest"; exit 1
          fi
          flux tag artifact "oci://${ARTIFACT}:${VERSION}" --tag latest --creds "${ACTOR}:${GH_TOKEN}"
          cosign sign --yes "${ARTIFACT}@${ARTIFACT_DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
