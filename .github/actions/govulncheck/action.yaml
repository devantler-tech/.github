name: Scan Go vulnerabilities
description: Internal implementation of the reusable Go workflow's reachable-vulnerability gate
author: devantler-tech
inputs:
  work-dir:
    description: Module directory, relative to the caller checkout
    default: '.'
  go-version-file:
    description: Caller Go version file, relative to the checkout
    required: true
  allow-file:
    description: Optional accepted advisory IDs, relative to the checkout
    default: ''
  output-file:
    description: Optional raw JSON report, relative to the checkout
    default: ''
outputs:
  verdict:
    description: clean or blocking after a completed scan; empty on operational failure
    value: ${{ steps.scan.outputs.verdict }}
runs:
  using: composite
  steps:
    - name: Set up the caller's Go version
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: false
    # Restore only: the default branch's Test job is the one module-cache writer
    # (devantler-tech/.github#565). Keep the key in step with validate-go-project.yaml.
    - name: Identify Go module cache
      id: go-mod-cache-path
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.work-dir }}
      run: |
        set -euo pipefail
        cache_path="$(go env GOMODCACHE)"
        [[ "$cache_path" == /* && "$cache_path" != *$'\n'* ]]
        printf 'path=%s\n' "$cache_path" >> "$GITHUB_OUTPUT"
    - name: Restore Go module cache
      id: go-mod-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-mod-cache-path.outputs.path }}
        key: go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.work-dir }}-${{ hashFiles(format('{0}/go.sum', inputs.work-dir)) }}
        restore-keys: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && format('go-mod-v1-{0}-{1}-{2}-', runner.os, runner.arch, inputs.work-dir) || '' }}
    # A module-proxy blip during the scan's own downloads reads as a failed scan.
    # Fetch them first with the shared bounded retry (actions/CONTRIBUTING.md
    # #reliability); the scan below still runs once. Guarded by test-govulncheck-download.sh.
    - name: Download the module dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORK_DIR: ${{ inputs.work-dir }}
        GOTOOLCHAIN: local
        RETRY_MAX_ATTEMPTS: '3'
        RETRY_BASE_DELAY: '5'
      run: bash "$ACTION_PATH/download.sh" "$WORK_DIR" "$ACTION_PATH/../../../.scripts/retry.sh"
    - name: Install the reviewed scanner version
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GOBIN: ${{ runner.temp }}/govulncheck-bin
        # The scanner's parser must support the newest Go version we test.
        # Scanning below still uses the caller's setup-go installation.
        GOTOOLCHAIN: go1.27.2
        GOWORK: 'off'
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
    - name: Scan and enforce reachable findings
      id: scan
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        SCANNER: ${{ runner.temp }}/govulncheck-bin/govulncheck
        WORK_DIR: ${{ inputs.work-dir }}
        ALLOW_FILE: ${{ inputs.allow-file }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        GOTOOLCHAIN: local
      run: bash "$ACTION_PATH/scan.sh" "$SCANNER" "$WORK_DIR" "$ALLOW_FILE" "$OUTPUT_FILE"
