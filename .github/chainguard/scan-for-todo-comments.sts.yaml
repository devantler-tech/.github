---
# Organization trust policy for the shared to-do scanner's project token
# (.github/workflows/scan-for-todo-comments.yaml and its create-issues-from-todos
# action), served by the GitHub token broker (devantler-tech/monorepo ADR 0020,
# #1001). Any devantler-tech repository's main branch may use it, but only while
# running that workflow on main or at a commit it pins. The broker policy check
# proves every such pin is a commit on this repository's main. The token adds the
# scanner's issues to the organization board: organization projects write only,
# scoped to the calling repository, on botantler-2. organization_projects is a
# privileged permission, so the broker policy check admits it only as this
# workflow's listed cross-repository grant.
issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:devantler-tech/[A-Za-z0-9._-]+:ref:refs/heads/main
claim_pattern:
  repository_owner_id: "178524219"
  job_workflow_ref: devantler-tech/\.github/\.github/workflows/scan-for-todo-comments\.yaml@([0-9a-f]{40}|refs/heads/main)
caller_repository: true
permissions:
  organization_projects: write
app: botantler-2
