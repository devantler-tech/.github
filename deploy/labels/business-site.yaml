# Complete canonical taxonomy is appended by the shared patch.
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: IssueLabels
metadata:
  name: business-site
  annotations:
    crossplane.io/external-name: business-site
spec:
  managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
  forProvider:
    repository: business-site
    label:
      - name: dependencies
        color: "0366d6"
      - name: github_actions
        color: "000000"
  providerConfigRef:
    kind: ProviderConfig
    name: default
