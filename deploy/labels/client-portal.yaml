# Observe existing labels before activating the authoritative taxonomy (#556).
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: IssueLabels
metadata:
  name: client-portal
  annotations:
    crossplane.io/external-name: client-portal
spec:
  managementPolicies: ["Observe"]
  forProvider:
    repository: client-portal
    label: []
  providerConfigRef:
    kind: ProviderConfig
    name: default
