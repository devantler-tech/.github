# Issue labels for devantler-tech/agent-plugins. The canonical org taxonomy (15 labels)
# is appended to every IssueLabels by the shared patch in kustomization.yaml; this
# file adds only agent-plugins's repo-specific extras: the dependency/ecosystem labels
# Dependabot/Renovate apply, and the two lifecycle labels Release Please uses to find
# the release PR it must tag (`autorelease: pending`) and to mark it done
# (`autorelease: tagged`). Declared so the authoritative set neither churns against the
# bots nor deletes release state. See ../README.md.
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: IssueLabels
metadata:
  name: agent-plugins
  annotations:
    crossplane.io/external-name: agent-plugins
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
  forProvider:
    repository: agent-plugins
    label:
      - name: "dependencies"
        color: "ededed"
      - name: "autorelease: pending"
        color: "ededed"
      - name: "autorelease: tagged"
        color: "ededed"
  providerConfigRef:
    kind: ProviderConfig
    name: default
