apiVersion: repo.github.m.upbound.io/v1alpha1
kind: IssueLabels
metadata:
  name: bookkeeper
  annotations:
    crossplane.io/external-name: bookkeeper
spec:
  managementPolicies: ["Observe", "Create", "Update"]
  forProvider:
    repository: bookkeeper
    # The shared patch supplies the canonical taxonomy; retain updater labels.
    label:
      - name: dependencies
        color: "0366d6"
      - name: github_actions
        color: "000000"
      - name: go
        color: "16e2e2"
  providerConfigRef:
    kind: ProviderConfig
    name: default
