# Declarative issue-label management for the devantler-tech org — the Crossplane
# replacement for the old EndBug/label-sync mechanism (the `sync-github-labels`
# action + the daily `.sync-labels.yaml` template-synced workflow + the central
# `actions/.github/labels.yaml` config). `IssueLabels` (provider-upjet-github,
# terraform github_issue_labels) is authoritative — it manages each repo's COMPLETE
# label set and reverts drift — exactly like the old action's `delete-other-labels:
# true`, so the cutover is behaviour-preserving.
#
# One file per managed repo declares only that repo's automation-specific EXTRAS,
# including dependency/ecosystem labels (`dependencies`, `go`, `docker`, …) and
# lifecycle labels whose presence carries automation state. Declaring them keeps
# the authoritative set from deleting state that those automations require. The
# shared patch below appends the CANONICAL org taxonomy (15 independent lifecycle
# and cross-cutting labels) to every IssueLabels. Native issue types own issue
# classification; the seven duplicate type-labels are retired (#747). This patch is
# the single source of truth for the taxonomy. Mirrors the org-wide settings
# patch in ../repositories/kustomization.yaml.
#
# Scope = the repos managed in ../repositories/ + this repo (.github) + the
# monorepo (labels-only for now — it is not yet declared in ../repositories/).
# Bring a new repo under management by adding `<repo>.yaml` with its live extras
# (enumerate them first so the authoritative set doesn't strip a label in use).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dot-github.yaml
  - monorepo.yaml
  - platform.yaml
  - ksail.yaml
  - agent-skills.yaml
  - agent-plugins.yaml
  - provider-upjet-unifi.yaml
  - unifi.yaml
  - aws.yaml
  - kyverno-policies.yaml
  - platform-tenant-template.yaml
  - platform-template.yaml
  - go-template.yaml
  - dotnet-template.yaml
  - homebrew-tap.yaml
  - cloudflare.yaml
  - khoist.yaml
  - business-site.yaml
  # Private repos.
  - ascoachingogvaner.yaml
  - wedding-app.yaml
  - fleet-gitops.yaml
  - world-at-ruin.yaml
  # Observe-first adoption; existing labels remain read-only (#556).
  - client-orders.yaml
# Canonical org-wide label taxonomy, appended to EVERY IssueLabels (single source
# of truth — was actions/.github/labels.yaml). Retained names and colours are
# unchanged; repository-specific automation labels remain in their own resources.
patches:
  - target:
      group: repo.github.m.upbound.io
      version: v1alpha1
      kind: IssueLabels
    patch: |-
      - op: add
        path: /spec/forProvider/label/-
        value: {name: blocked, color: "d93f0b"}
      - op: add
        path: /spec/forProvider/label/-
        value: {name: released, color: "ededed"}
      - op: add
        path: /spec/forProvider/label/-
        value: {name: next, color: "5d3fd3"}
      - op: add
        path: /spec/forProvider/label/-
        value: {name: help wanted, color: "008672"}
      - op: add
        path: /spec/forProvider/label/-
        value: {name: good first issue, color: "7057ff"}
      - op: add
        path: /spec/forProvider/label/-
        value: {name: question, color: "d876e3"}
      - op: add
        path: /spec/forProvider/label/-
        value: {name: duplicate, color: "cfd3d7"}
      - op: add
        path: /spec/forProvider/label/-
        value: {name: wontfix, color: "ffffff"}
      - op: add
        path: /spec/forProvider/label/-
        value: {name: spam, color: "e4e669"}
      - op: add
        path: /spec/forProvider/label/-
        value: {name: off topic, color: "e4e669"}
      - op: add
        path: /spec/forProvider/label/-
        value: {name: needs triage, color: "fbca04"}
      - op: add
        path: /spec/forProvider/label/-
        value: {name: needs investigation, color: "fbca04"}
      - op: add
        path: /spec/forProvider/label/-
        value: {name: breaking change, color: "b60205"}
      - op: add
        path: /spec/forProvider/label/-
        value: {name: automation, color: "bfdadc"}
      - op: add
        path: /spec/forProvider/label/-
        value: {name: repo-assist, color: "bfdadc"}
