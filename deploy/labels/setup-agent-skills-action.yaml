apiVersion: repo.github.m.upbound.io/v1alpha1
kind: IssueLabels
metadata:
  name: setup-agent-skills-action
  annotations:
    crossplane.io/external-name: setup-agent-skills-action
spec:
  managementPolicies: ["Observe", "Create", "Update"]
  forProvider:
    repository: setup-agent-skills-action
    # The shared patch supplies the canonical taxonomy; retain updater labels.
    label:
      - name: dependencies
        color: "0366d6"
      - name: github_actions
        color: "000000"
  providerConfigRef:
    kind: ProviderConfig
    name: default
