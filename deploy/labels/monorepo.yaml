# Issue labels for devantler-tech/monorepo. The canonical org taxonomy (15 labels)
# is appended to every IssueLabels by the shared patch in kustomization.yaml; this
# file adds only the monorepo's repo-specific extras (the dependency/ecosystem
# labels Dependabot applies — incl. `submodules` for the gitsubmodule ecosystem),
# declared so the authoritative set doesn't churn against the bots, and the five
# labels the daily maintainer ask workflows use: an ask, urgency, cap delay,
# confirmed urgent delivery and the digest. See ../README.md (issue #629).
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: IssueLabels
metadata:
  name: monorepo
  annotations:
    crossplane.io/external-name: monorepo
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
  forProvider:
    repository: monorepo
    label:
      - name: "dependencies"
        color: "0366d6"
      - name: "github_actions"
        color: "000000"
      - name: "javascript"
        color: "168700"
      - name: "submodules"
        color: "000000"
      - name: "maintainer-ask"
        color: "fbca04"
      - name: "maintainer-ask-urgent"
        color: "b60205"
      - name: "maintainer-ask-cap-delayed"
        color: "fbca04"
      - name: "maintainer-ask-delivered"
        color: "0e8a16"
      - name: "maintainer-digest"
        color: "0e8a16"
  providerConfigRef:
    kind: ProviderConfig
    name: default
