apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: ksail
  annotations:
    # Binds this resource to the EXISTING devantler-tech/ksail repository
    # (owner comes from the ProviderConfig credentials).
    crossplane.io/external-name: ksail
spec:
  # Observe-only while the declared `pages` below replaces the stale provider
  # state in the live resource. Create/Update return once the live resource reads
  # back exactly the declared `pages` (#232).
  managementPolicies: ["Observe"]
  forProvider:
    name: ksail
    visibility: public
    archived: false
    description: "All-in-one Kubernetes SDK: create, manage, and operate clusters across distributions (Kind, K3d, Talos, VCluster) with built-in GitOps, secrets, AI assistant, and MCP server. Only requires Docker or a Cloud Provider."
    homepageUrl: "https://ksail.devantler.tech/"
    # Declared exactly as GitHub reports this workflow-built site, with no
    # `source` (GitHub reports none for workflow builds). The GitHub App cannot
    # write Pages, so any difference here would retry a Pages update forever;
    # declaring the whole list replaces stale provider state (#232).
    pages:
      - buildType: workflow
        cname: ksail.devantler.tech
    topics: ["argocd", "chat", "cli", "cloud-native", "developer-tool", "devops", "docker", "flux", "github-copilot", "gitops", "helm", "k3s", "kind", "kubernetes", "local-development", "mcp-server", "provisioner", "talos", "tui", "vcluster"]
  providerConfigRef:
    kind: ProviderConfig
    name: default
