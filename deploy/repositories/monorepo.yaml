apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: monorepo
  annotations:
    # Binds this resource to the EXISTING devantler-tech/monorepo repository
    # (owner comes from the ProviderConfig credentials).
    crossplane.io/external-name: monorepo
spec:
  # Observe-first adoption: LateInitialize copies the live settings into
  # forProvider and nothing is written. Create/Update follow once the live
  # resource carries every setting, because an optional setting left unset would
  # otherwise be sent as its zero value (#115).
  managementPolicies: ["Observe", "LateInitialize"]
  forProvider:
    name: monorepo
    visibility: public
    archived: false
    description: "A home for all devantler's projects."
    homepageUrl: "https://devantler.tech"
    topics: ["metadata"]
  providerConfigRef:
    kind: ProviderConfig
    name: default
