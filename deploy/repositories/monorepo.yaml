apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: monorepo
  annotations:
    # Binds this resource to the EXISTING devantler-tech/monorepo repository
    # (owner comes from the ProviderConfig credentials).
    crossplane.io/external-name: monorepo
spec:
  # Adopted with Observe + LateInitialize, which copied the live settings into
  # forProvider (#115). This repository hosts a workflow-built Pages site, but
  # provider state carries no `pages` field, so an update sends no Pages change
  # (compare ksail.yaml, #232).
  managementPolicies: ["Observe", "Create", "Update"]
  forProvider:
    name: monorepo
    visibility: public
    archived: false
    description: "A home for all devantler's projects."
    homepageUrl: "https://devantler.tech"
    topics: ["metadata"]
  providerConfigRef:
    kind: ProviderConfig
    name: default
