apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: platform
  annotations:
    # Binds this resource to the EXISTING devantler-tech/platform repository
    # (owner comes from the ProviderConfig credentials).
    crossplane.io/external-name: platform
spec:
  # Observe-only while the declared `pages` below replaces the stale provider
  # state in the live resource. Create/Update return once the live resource reads
  # back exactly the declared `pages` (#232).
  managementPolicies: ["Observe"]
  forProvider:
    name: platform
    visibility: public
    archived: false
    description: "DevantlerTech Platform - including deployment artifacts for running the platform in CI/CD and in Talos Omni."
    homepageUrl: "http://platform.devantler.tech/"
    # Declared exactly as GitHub reports this workflow-built site, with no
    # `source` or `cname` (GitHub reports neither). The GitHub App cannot write
    # Pages, so any difference here would retry a Pages update forever;
    # declaring the whole list replaces stale provider state (#232).
    pages:
      - buildType: workflow
    topics: ["infrastructure"]
  providerConfigRef:
    kind: ProviderConfig
    name: default
