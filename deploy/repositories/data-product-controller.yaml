apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: data-product-controller
  annotations:
    crossplane.io/external-name: data-product-controller
spec:
  # Observe-only: the first stage of the Observe-first adoption flow. Crossplane
  # mirrors this repository read-only and writes nothing, so adopting it cannot
  # change the live repository. The visibility and description below state the
  # live values. The shared patch in kustomization.yaml still declares the org's
  # merge policy here, so scripts/check-repository-drift.sh reports any live
  # setting that diverges from it. Enabling Create/Update is a separate,
  # deliberate step once this resource reports Synced/Ready.
  managementPolicies:
    - Observe
  forProvider:
    name: data-product-controller
    visibility: public
    archived: false
    description: "A cloud-native controller for composable, self-describing data products."
  providerConfigRef:
    kind: ProviderConfig
    name: default
