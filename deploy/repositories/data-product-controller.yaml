apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: data-product-controller
  annotations:
    crossplane.io/external-name: khoist
spec:
  # Observe and Update only while the repository is renamed (#597): if the
  # lookup ever misses during the rename, the sync must report it rather than
  # create a new empty repository. Restore Create once the rename is verified.
  managementPolicies: ["Observe", "Update"]
  # Pages was bootstrapped separately. Preserve its initial declaration without
  # asking the managed App to write Pages; the drift audit still verifies it.
  initProvider:
    pages:
      - buildType: workflow
        cname: khoist.devantler.tech
  forProvider:
    name: khoist
    visibility: public
    archived: false
    description: "A cloud-native controller for composable, self-describing data products."
    homepageUrl: https://khoist.devantler.tech/
    # Issues are used here; an undeclared bool takes the provider default (false) on update (#311).
    hasIssues: true
  providerConfigRef:
    kind: ProviderConfig
    name: default
