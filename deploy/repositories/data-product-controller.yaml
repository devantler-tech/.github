apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: data-product-controller
  annotations:
    crossplane.io/external-name: data-product-controller
spec:
  # The adopted repository is Synced/Ready. Apply the shared repository policy.
  managementPolicies: ["Observe", "Create", "Update"]
  forProvider:
    name: data-product-controller
    visibility: public
    archived: false
    description: "A cloud-native controller for composable, self-describing data products."
  providerConfigRef:
    kind: ProviderConfig
    name: default
