apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: wedding-app
  annotations:
    crossplane.io/external-name: wedding-app
spec:
  # Observe-only while the declared value catches up with reality. The repository
  # is public and serves the live wedding site, so `public` below is the live
  # value, not a change of policy — the previous `private` was carried in from the
  # template this file was written against and was never true of this repository.
  # Restoring Create/Update is a separate step, tracked on
  # devantler-tech/.github#123; it is safe to take only because declared and live
  # now agree, so enabling writes can no longer take the site off the internet.
  managementPolicies:
    - Observe
  forProvider:
    name: wedding-app
    visibility: public
    archived: false
    description: "A simple wedding API service deployed to the devantler-tech/platform Kubernetes cluster."
  providerConfigRef:
    kind: ProviderConfig
    name: default
