apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: dot-github
  annotations:
    # Binds this resource to the EXISTING devantler-tech/.github repository
    # (owner comes from the ProviderConfig credentials).
    crossplane.io/external-name: .github
spec:
  # Adopted with Observe + LateInitialize, which copied the live settings into
  # forProvider. Updates apply the org's squash-only merge policy from the shared
  # patch to this repository's own settings (#115).
  managementPolicies: ["Observe", "Create", "Update"]
  forProvider:
    name: .github
    visibility: public
    archived: false
    description: "A public organization profile"
    topics: ["metadata"]
  providerConfigRef:
    kind: ProviderConfig
    name: default
