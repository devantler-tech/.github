apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: agent-plugins
  annotations:
    # Adopts the agent-plugins repo directly (renamed from plugins). Fresh MR:
    # the old "plugins" MR is pruned (orphans the repo — no Delete in
    # managementPolicies, never deletes) and this one adopts via the correct
    # external-name, so the provider observes directly and reconciles cleanly.
    crossplane.io/external-name: agent-plugins
spec:
  # The squash-only merge policy and the org-enforced commit signoff come from
  # the shared patch. Description is declared here so the config is
  # AUTHORITATIVE for it. Settings declared
  # nowhere here keep the value adopted from the live repo when it was first
  # observed.
  managementPolicies:
    - Observe
    - Create
    - Update
  forProvider:
    name: agent-plugins
    # Fixes a stale repo reference: `devantler-tech/skills` was renamed to
    # `devantler-tech/agent-skills`, so the old description pointed at a name
    # that no longer exists. Also names the bundled MCP servers and agents —
    # the marketplace is deliberately not skills-only.
    description: "Tool-neutral agent-plugin marketplace — bundles curated skills, MCP servers and agents from devantler-tech/agent-skills into category plugins for VS Code, GitHub Copilot CLI, and Claude Code"
    # Topics stay temporarily unmanaged. provider-upjet-github v0.19.1 embeds
    # terraform-provider-github v6.6.0, whose repository update includes the
    # org-enforced web-signoff field and makes GitHub reject the whole PATCH.
    # Restore topics after a provider release includes the upstream v6.12 fix.
  providerConfigRef:
    kind: ProviderConfig
    name: default
