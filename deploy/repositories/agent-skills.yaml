apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: agent-skills
  annotations:
    # Adopts the agent-skills repo directly (renamed from skills). This is a
    # fresh MR: the old "skills" MR is pruned (orphans the repo — no Delete in
    # managementPolicies, never deletes) and this one adopts via the correct
    # external-name, so the provider observes directly (no rename redirect) and
    # reconciles cleanly.
    crossplane.io/external-name: agent-skills
spec:
  # The squash-only merge policy and the org-enforced commit signoff come from
  # the shared patch. Description is declared here so the config is
  # AUTHORITATIVE for it. Settings declared
  # nowhere here keep the value adopted from the live repo when it was first
  # observed.
  managementPolicies:
    - Observe
    - Create
    - Update
  forProvider:
    name: agent-skills
    # De-Copilot-branded: these skills are agent-neutral (agentskills.io spec)
    # and install into Claude Code, Cursor, Codex and Gemini CLI as well, via
    # either `gh skill install` or `npx skills add`. The old wording undersold
    # that and read as Copilot-only.
    description: "Agent-neutral skills for Claude Code, Copilot, Cursor and Codex — install with `gh skill install` or `npx skills add`"
    # Topics stay temporarily unmanaged. provider-upjet-github v0.19.1 embeds
    # terraform-provider-github v6.6.0, whose repository update includes the
    # org-enforced web-signoff field and makes GitHub reject the whole PATCH.
    # Restore topics after a provider release includes the upstream v6.12 fix.
  providerConfigRef:
    kind: ProviderConfig
    name: default
