# Observe-first adoption; settings activation follows verified live adoption (#556).
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: client-portal
  annotations:
    crossplane.io/external-name: client-portal
spec:
  managementPolicies: ["Observe"]
  forProvider:
    name: client-portal
  providerConfigRef:
    kind: ProviderConfig
    name: default
