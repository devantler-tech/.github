# One file per managed repository. Adoption is Observe-first: a repo starts with
# managementPolicies: ["Observe"] (read-only — Crossplane mirrors live state into
# status.atProvider and never writes), then forProvider is set and the policy
# promoted to Observe/Create/Update by the shared patch below. Namespaced managed
# resources have no deletionPolicy; omitting Delete is what guarantees Crossplane
# can never delete a real GitHub repository. LateInitialize is omitted too: it
# copies live-only values back into forProvider, and every field that lands there
# is sent on every subsequent update PATCH. See devantler-tech/platform
# docs/github-management.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Actively managed (Observe/Create/Update). The shared policy patch below
  # applies to all Repository resources in this kustomization, while each file
  # retains its own lifecycle policy.
  - maintenance.yaml
  - agent-skills.yaml
  - agent-plugins.yaml
  - provider-upjet-unifi.yaml
  - unifi.yaml
  - aws.yaml
  - kyverno-policies.yaml
  - platform-tenant-template.yaml
  - platform-template.yaml
  - go-template.yaml
  - dotnet-template.yaml
  - homebrew-tap.yaml
  - fleet-gitops.yaml
  # Active repositories temporarily contained at Observe-only while #232
  # removes provider-owned deprecated Pages state from their live CRs. The
  # declarations remain complete and the shared policy patch still renders, but
  # Crossplane issues no writes until clean re-adoption is verified.
  - platform.yaml
  - ksail.yaml
  # Observe-only (read-only mirror; Crossplane writes nothing). They are listed
  # apart because of their management policy, not their visibility. Promoting
  # them to Observe/Create/Update waits on the provider repin tracked on
  # devantler-tech/platform#2800 (see world-at-ruin.yaml for why).
  - world-at-ruin.yaml
  - ascoachingogvaner.yaml
  - wedding-app.yaml
  # Observe-first adoption (Observe + LateInitialize): mirrors live settings into
  # forProvider before Create/Update are enabled (#115).
  - dot-github.yaml
  - monorepo.yaml
# Org-wide repo settings applied to EVERY Repository, single source of truth
# (auto-applies to every future repo). This includes the Observe-only ones:
# Crossplane never writes those, but scripts/check-repository-drift.sh compares
# every declared field against live GitHub, so the declaration still states the
# policy and a live divergence still fails the check. Exempting them would hide
# exactly the drift that check exists to find.
#  - squash-only merge policy (merge commits + rebase disabled; auto-merge,
#    auto-delete head branches, always-suggest-updating-PR-branches enabled).
#  - webCommitSignoffRequired: true — declared precisely BECAUSE the org enforces
#    it. Leaving the field unconfigured creates a permanent false-versus-live-true
#    diff. The deployed provider-upjet-github v0.20.0 embeds
#    terraform-provider-github v6.13.0, whose upstream #2077 fix omits the
#    unchanged field when another Repository setting needs an update.
#  - hasDownloads: false — GitHub has removed the downloads feature and no
#    longer returns the field, so status.atProvider never carries it. The
#    Terraform provider still defaults it to true, so a spec holding that default
#    carries a value the API can never report back. That is an unresolvable diff:
#    the provider sees spec != live on every reconcile and issues an update PATCH
#    forever. Pinning the field to the value the API actually reflects is what
#    stops the diff.
# managementPolicies stays per repo: adoption is Observe-first, and a shared
# override would promote a repo to writing the moment it is added.
patches:
  - target:
      group: repo.github.m.upbound.io
      version: v1alpha1
      kind: Repository
    patch: |-
      - op: add
        path: /spec/forProvider/allowSquashMerge
        value: true
      - op: add
        path: /spec/forProvider/allowMergeCommit
        value: false
      - op: add
        path: /spec/forProvider/allowRebaseMerge
        value: false
      - op: add
        path: /spec/forProvider/allowAutoMerge
        value: true
      - op: add
        path: /spec/forProvider/allowUpdateBranch
        value: true
      - op: add
        path: /spec/forProvider/deleteBranchOnMerge
        value: true
      - op: add
        path: /spec/forProvider/webCommitSignoffRequired
        value: true
      - op: add
        path: /spec/forProvider/hasDownloads
        value: false
