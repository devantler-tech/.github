apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: ascoachingogvaner
  annotations:
    crossplane.io/external-name: ascoachingogvaner
spec:
  # Observe-only while the declared value catches up with reality. The repository
  # is public and serves the live AS Coaching og Vaner site, so `public` below is
  # the live value, not a change of policy — the previous `private` was carried in
  # from the template this file was written against and was never true of this
  # repository. Restoring Create/Update is a separate step, tracked on
  # devantler-tech/.github#123; it is safe to take only because declared and live
  # now agree, so enabling writes can no longer take the site off the internet.
  managementPolicies:
    - Observe
  forProvider:
    name: ascoachingogvaner
    visibility: public
    archived: false
    description: "AS Coaching og Vaner — coaching website (platform tenant)"
  providerConfigRef:
    kind: ProviderConfig
    name: default
