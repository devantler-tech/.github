apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: ascoachingogvaner
  annotations:
    crossplane.io/external-name: ascoachingogvaner
spec:
  # Observe-only: Crossplane mirrors this repository read-only and writes nothing.
  # The repository is public and serves the live AS Coaching og Vaner site, and the
  # visibility below states that live value — so enacting this declaration would be
  # a no-op rather than a change. Enabling Create/Update is a separate, deliberate
  # step, tracked on devantler-tech/.github#123.
  managementPolicies:
    - Observe
  forProvider:
    name: ascoachingogvaner
    visibility: public
    archived: false
    description: "AS Coaching og Vaner — coaching website (platform tenant)"
  providerConfigRef:
    kind: ProviderConfig
    name: default
