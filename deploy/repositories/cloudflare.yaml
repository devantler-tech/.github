apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: cloudflare
  annotations:
    crossplane.io/external-name: cloudflare
spec:
  # The adopted repository is Synced/Ready. Apply the shared repository policy.
  managementPolicies: ["Observe", "Create", "Update"]
  forProvider:
    name: cloudflare
    visibility: public
    archived: false
    description: "Declarative, cluster-independent Cloudflare infrastructure for devantler-tech"
  providerConfigRef:
    kind: ProviderConfig
    name: default
