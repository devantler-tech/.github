apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: platform-tenant-template
  annotations:
    crossplane.io/external-name: platform-tenant-template
spec:
  # Provider v0.20.0 embeds terraform-provider-github v6.13.0, which omits an
  # unchanged organization-enforced signoff field from Repository updates. The
  # previous compatibility fence is therefore no longer needed.
  managementPolicies:
    - Observe
    - Create
    - Update
  forProvider:
    name: platform-tenant-template
    # Pinned because this resource carries no adopted values: it is the one
    # active repository whose spec holds nothing beyond what the config declares,
    # so an update cannot fall back on a previously observed visibility the way
    # every other repository here can. Declaring the live value is what makes
    # restoring the write path (#112) unable to change it.
    visibility: public
    hasIssues: true
    # Matches live state and keeps Projects disabled declaratively.
    hasProjects: false
    description: "Template for platform tenants on the devantler-tech platform — framework-agnostic CI/CD plumbing kept current via template-sync."
  providerConfigRef:
    kind: ProviderConfig
    name: default
