# `RepositoryRuleset` resources — one per file, named `<verb>-on-<repo>.yaml`, each a
# repo-scoped rule. Existing rules adopt Observe-first (read-only), with external-name
# set to the bare numeric ruleset id (a `<repo>:` prefix fails the provider's ParseInt).
# New rules use an explicit non-deleting managed lifecycle. See
# ../organization-rulesets/README.md for the shared adoption convention and the provider
# importability matrix. Included by ../kustomization.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - require-cla-gate-on-world-at-ruin.yaml
  - require-merge-queue-on-platform.yaml
  - require-validation-on-dotnet-template.yaml
  - require-validation-on-go-template.yaml
  - require-scaffold-validation-on-platform-tenant-template.yaml
  - require-reviewed-admission-on-monorepo.yaml
  - require-reviewed-admission-on-dotgithub.yaml
