# Retain the executed-result binding during the approved engine setup recovery.
# Keep its identity, selector, producer and non-deleting lifecycle unchanged;
# the established World-specific required workflow stays active for native proof.
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryRuleset
metadata:
  name: world-at-ruin-require-reviewed-admission
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
  forProvider:
    repository: world-at-ruin
    name: Require reviewed repository admission
    target: branch
    enforcement: disabled
    conditions:
      - refName:
          - include: ["~DEFAULT_BRANCH"]
            exclude: []
    rules:
      - requiredStatusChecks:
          - requiredCheck:
              - context: Run reviewed product admission
                integrationId: 15368
            strictRequiredStatusChecksPolicy: false
  providerConfigRef:
    kind: ProviderConfig
    name: default
