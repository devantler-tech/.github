# First enforce the repository-owned matrix alongside its temporary org source.
# Verify native creation and an ordinary consumer PR before retiring the org rule.
# These are observed job names, not the workflow title. Bind the producer to
# GitHub Actions (15368), never to an arbitrary status context from another App.
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryRuleset
metadata:
  name: dotnet-template-require-validation
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
  forProvider:
    repository: dotnet-template
    name: Require local .NET template validation
    target: branch
    enforcement: active
    conditions:
      - refName:
          - include: ["~DEFAULT_BRANCH"]
            exclude: []
    rules:
      - requiredStatusChecks:
          - requiredCheck:
              - context: test (ubuntu-latest)
                integrationId: 15368
              - context: test (windows-latest)
                integrationId: 15368
              - context: test (macos-latest)
                integrationId: 15368
            strictRequiredStatusChecksPolicy: false
  providerConfigRef:
    kind: ProviderConfig
    name: default
