# agent-plugins' "Require merge queue" rule on the default branch
# (devantler-tech/agent-plugins#704). merge_queue is a repo-only rule type; org
# rulesets cannot carry it.
#
# The queue runs the required checks on the exact result each PR would land as,
# so a PR opened before a new gate reached main still meets that gate before it
# merges. It replaces agent-plugins' own recheck-open-prs workflow, which only
# re-ran open PRs after main moved. agent-plugins' CI must run on `merge_group`
# before this rule is active, or queued PRs would wait for a check that never
# starts.
#
# The queue settings are copied from require-merge-queue-on-platform.yaml,
# including the OrganizationAdmin bypass. The 120-minute response window absorbs
# hosted-runner queueing (platform#3097).
#
# Net-new and managed: no external-name, so Crossplane creates it on first
# reconcile. LateInitialize writes the created id back as the external-name, so a
# provider restart cannot create a second copy. No Delete: removing this file
# orphans the ruleset instead of deleting a live merge gate.
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryRuleset
metadata:
  name: agent-plugins-require-merge-queue
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
  forProvider:
    repository: agent-plugins
    name: Require merge queue
    target: branch
    enforcement: active
    bypassActors:
      - actorType: OrganizationAdmin
        bypassMode: always
    conditions:
      - refName:
          - include: ["~DEFAULT_BRANCH"]
            exclude: []
    rules:
      - mergeQueue:
          - checkResponseTimeoutMinutes: 120
            groupingStrategy: ALLGREEN
            maxEntriesToBuild: 2
            maxEntriesToMerge: 1
            mergeMethod: SQUASH
            minEntriesToMerge: 1
            minEntriesToMergeWaitMinutes: 5
  providerConfigRef:
    kind: ProviderConfig
    name: default
