# No team grant existed in the repository-scoped census for #556.
apiVersion: team.github.m.upbound.io/v1alpha1
kind: TeamRepository
metadata:
  name: maintainers-client-orders
spec:
  managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
  forProvider:
    teamIdRef:
      name: maintainers
      policy:
        resolve: Always
    repository: client-orders
    permission: maintain
  providerConfigRef:
    kind: ProviderConfig
    name: default
