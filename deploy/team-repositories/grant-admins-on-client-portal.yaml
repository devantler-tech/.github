# No team grant existed in the repository-scoped census for #556.
apiVersion: team.github.m.upbound.io/v1alpha1
kind: TeamRepository
metadata:
  name: admins-client-portal
spec:
  managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
  forProvider:
    teamIdRef:
      name: admins
      policy:
        resolve: Always
    repository: client-portal
    permission: admin
  providerConfigRef:
    kind: ProviderConfig
    name: default
