apiVersion: team.github.m.upbound.io/v1alpha1
kind: TeamRepository
metadata:
  name: maintainers-bookkeeper
spec:
  managementPolicies: ["Observe", "Create", "Update"]
  forProvider:
    teamIdRef:
      name: maintainers
      policy:
        resolve: Always
    repository: bookkeeper
    permission: maintain
  providerConfigRef:
    kind: ProviderConfig
    name: default
