# Retain the singleton identity after native shared-admission overlap proof.
# The shared reviewed runner and World-bound executed result now enforce the
# complete product-owned selection. Preserve selectors and non-deleting lifecycle;
# the provider requires one inert rule even with enforcement disabled.
apiVersion: enterprise.github.m.upbound.io/v1alpha1
kind: OrganizationRuleset
metadata:
  name: require-world-at-ruin-trusted-regressions
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
  forProvider:
    name: Require workflow - World at Ruin trusted regressions
    target: branch
    enforcement: disabled
    conditions:
      - refName:
          - include: ["~DEFAULT_BRANCH"]
            exclude: []
        repositoryId: [1303188705]
    rules:
      - creation: false
        deletion: false
        nonFastForward: false
        requiredLinearHistory: false
        requiredSignatures: false
        update: false
  providerConfigRef:
    kind: ProviderConfig
    name: default
