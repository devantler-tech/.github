# Complete native policy observed before migration (#237 / #674).
# Preserve selectors, bypasses and lifecycle; change only the required source.
apiVersion: enterprise.github.m.upbound.io/v1alpha1
kind: OrganizationRuleset
metadata:
  name: require-dotnet-template-tests
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
  forProvider:
    conditions:
      - refName:
          - include:
              - ~DEFAULT_BRANCH
            exclude: []
        repositoryId:
          - 825979604
    enforcement: active
    name: Require workflow - .NET template tests
    rules:
      - creation: false
        deletion: false
        nonFastForward: false
        requiredLinearHistory: false
        requiredSignatures: false
        requiredWorkflows:
          - doNotEnforceOnCreate: false
            requiredWorkflow:
              - path: .github/workflows/run-dotnet-tests.yaml
                ref: refs/heads/main
                repositoryId: 933213756
        update: false
    target: branch
  providerConfigRef:
    kind: ProviderConfig
    name: default
