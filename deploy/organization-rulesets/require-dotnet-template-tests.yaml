# Complete native policy observed before migration (#237 / #674).
# Native repository enforcement proved in .github#688 and dotnet-template#543.
# One inert rule (every flag false, no required workflow) retires its old source
# association before wrapper removal (#703); the provider requires a rules block.
# Retain the complete disabled policy for identity and rollback, without Delete.
apiVersion: enterprise.github.m.upbound.io/v1alpha1
kind: OrganizationRuleset
metadata:
  name: require-dotnet-template-tests
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
  forProvider:
    conditions:
      - refName:
          - include:
              - ~DEFAULT_BRANCH
            exclude: []
        repositoryId:
          - 825979604
    enforcement: disabled
    name: Require workflow - .NET template tests
    rules:
      - creation: false
        deletion: false
        nonFastForward: false
        requiredLinearHistory: false
        requiredSignatures: false
        update: false
    target: branch
  providerConfigRef:
    kind: ProviderConfig
    name: default
