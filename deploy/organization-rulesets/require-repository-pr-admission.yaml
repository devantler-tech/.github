# Shared admission for monorepo and this catalogue; product decisions stay local.
# World's native overlap exposed a missing engine setup step. Pause only its
# new enrollment for the approved recovery; its established gate stays active.
apiVersion: enterprise.github.m.upbound.io/v1alpha1
kind: OrganizationRuleset
metadata:
  name: require-repository-pr-admission
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
  forProvider:
    name: Require workflow - Repository PR admission
    target: branch
    enforcement: active
    conditions:
      - refName:
          - include: ["~DEFAULT_BRANCH"]
            exclude: []
        repositoryId: [786274843, 933213756]
    rules:
      - requiredWorkflows:
          - requiredWorkflow:
              - repositoryId: 933213756
                path: .github/workflows/repository-pr-admission.yaml
                ref: refs/heads/main
  providerConfigRef:
    kind: ProviderConfig
    name: default
