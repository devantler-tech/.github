# Shared admission for monorepo, this catalogue and World; product decisions stay local.
# All three products passed native positive and tampering-refusal controls;
# their separate executed-result bindings remain mandatory after singleton retirement.
apiVersion: enterprise.github.m.upbound.io/v1alpha1
kind: OrganizationRuleset
metadata:
  name: require-repository-pr-admission
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
  forProvider:
    name: Require workflow - Repository PR admission
    target: branch
    enforcement: active
    conditions:
      - refName:
          - include: ["~DEFAULT_BRANCH"]
            exclude: []
        repositoryId: [786274843, 933213756, 1303188705]
    rules:
      - requiredWorkflows:
          - requiredWorkflow:
              - repositoryId: 933213756
                path: .github/workflows/repository-pr-admission.yaml
                ref: refs/heads/main
  providerConfigRef:
    kind: ProviderConfig
    name: default
