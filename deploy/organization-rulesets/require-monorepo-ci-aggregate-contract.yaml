# Retain the retired singleton identity without a workflow association.
# Shared reviewed admission plus the repository-bound executed result now
# enforce the product-owned aggregate validator; native positive/refusal proof
# precedes this retirement. The provider requires one rule, so keep it inert.
apiVersion: enterprise.github.m.upbound.io/v1alpha1
kind: OrganizationRuleset
metadata:
  name: require-monorepo-ci-aggregate-contract
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
  forProvider:
    name: Require workflow - Monorepo CI aggregate contract
    target: branch
    enforcement: disabled
    conditions:
      - refName:
          - include: ["~DEFAULT_BRANCH"]
            exclude: []
        repositoryId: [786274843]
    rules:
      - creation: false
        deletion: false
        nonFastForward: false
        requiredLinearHistory: false
        requiredSignatures: false
        update: false
  providerConfigRef:
    kind: ProviderConfig
    name: default
