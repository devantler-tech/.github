# Retain the retired singleton identity without a workflow association.
# Shared reviewed admission plus the repository-bound executed result now
# enforce product-owned deployment validation after native positive/refusal
# proof. Keep one provider-required inert rule, no bypass and no Delete policy.
apiVersion: enterprise.github.m.upbound.io/v1alpha1
kind: OrganizationRuleset
metadata:
  name: require-dotgithub-deploy-guards
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
  forProvider:
    name: Require workflow - .github deploy guards
    target: branch
    enforcement: disabled
    conditions:
      - refName:
          - include: ["~DEFAULT_BRANCH"]
            exclude: []
        repositoryId: [933213756]
    rules:
      - creation: false
        deletion: false
        nonFastForward: false
        requiredLinearHistory: false
        requiredSignatures: false
        update: false
  providerConfigRef:
    kind: ProviderConfig
    name: default
