# Complete native policy observed before migration (#237 / #674).
# Native repository enforcement proved in .github#692 and go-template#422.
# Retain the complete disabled policy for identity and rollback, without Delete.
apiVersion: enterprise.github.m.upbound.io/v1alpha1
kind: OrganizationRuleset
metadata:
  name: require-go-template-validation
spec:
  managementPolicies:
    - Observe
    - Create
    - Update
    - LateInitialize
  forProvider:
    conditions:
      - refName:
          - include:
              - ~DEFAULT_BRANCH
            exclude: []
        repositoryId:
          - 1065308377
    enforcement: disabled
    name: Require workflow - Go template validation
    rules:
      - creation: false
        deletion: false
        nonFastForward: false
        requiredLinearHistory: false
        requiredSignatures: false
        requiredWorkflows:
          - doNotEnforceOnCreate: false
            requiredWorkflow:
              - path: .github/workflows/validate-go-project.yaml
                ref: refs/heads/main
                repositoryId: 933213756
        update: false
    target: branch
  providerConfigRef:
    kind: ProviderConfig
    name: default
