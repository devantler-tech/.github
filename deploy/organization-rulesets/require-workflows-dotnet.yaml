# Retired after a complete effective-policy census found no consumers (#703).
# Retain the managed identity, selectors, bypasses and non-deleting lifecycle;
# empty rules must no longer reference the obsolete workflow source.
apiVersion: enterprise.github.m.upbound.io/v1alpha1
kind: OrganizationRuleset
metadata:
  name: require-workflows-dotnet
  annotations:
    crossplane.io/external-name: "3716863"
spec:
  managementPolicies:
    - Observe
    - Update
  forProvider:
    bypassActors:
      - actorType: OrganizationAdmin
        bypassMode: always
    conditions:
      - refName:
          - include:
              - ~DEFAULT_BRANCH
            exclude: []
        repositoryProperty:
          - include:
              - name: language
                propertyValues:
                  - C#
                source: system
    enforcement: disabled
    name: Require workflows to pass before merging for .NET
    rules: []
    target: branch
  providerConfigRef:
    kind: ProviderConfig
    name: default
