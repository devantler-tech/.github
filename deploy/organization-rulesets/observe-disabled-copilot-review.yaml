# Existing disabled policy still selects a property awaiting retirement (#773).
# Observe its complete provider state before any separate reviewed adoption.
# Identity-only import: never create, update, late-initialize or delete the rule.
apiVersion: enterprise.github.m.upbound.io/v1alpha1
kind: OrganizationRuleset
metadata:
  name: observe-disabled-copilot-review
  annotations:
    crossplane.io/external-name: "14426508"
spec:
  managementPolicies: ["Observe"]
  forProvider:
    name: Automatically request Copilot code review
    target: branch
    enforcement: disabled
  providerConfigRef:
    kind: ProviderConfig
    name: default
