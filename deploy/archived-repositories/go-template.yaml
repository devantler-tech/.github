# devantler-tech/go-template retires: the application template now scaffolds Go and .NET
# applications (ADR 0018, devantler-tech/monorepo#5059), and its two consumers, KHoist and
# Bookkeeper, now sync from the application template.
#
# One-time archive update, see kustomization.yaml. The provider computes the update from
# this declaration alone and sends every omitted setting as its default, so each setting
# below is declared at its live value (read 2026-11-22) and the only change is
# `archived: true`. Once GitHub reports the repository archived, a follow-up returns this
# resource to Observe-only.
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: go-template
  annotations:
    crossplane.io/external-name: go-template
spec:
  managementPolicies: ["Observe", "Update"]
  forProvider:
    name: go-template
    archived: true
    description: "A simple Go template for new projects."
    homepageUrl: ""
    topics: ["template"]
    visibility: public
    isTemplate: true
    hasIssues: true
    hasProjects: false
    hasWiki: false
    hasDiscussions: false
    hasDownloads: false
    allowMergeCommit: false
    allowSquashMerge: true
    allowRebaseMerge: false
    allowAutoMerge: true
    allowUpdateBranch: true
    deleteBranchOnMerge: true
    squashMergeCommitTitle: COMMIT_OR_PR_TITLE
    squashMergeCommitMessage: COMMIT_MESSAGES
    mergeCommitTitle: MERGE_MESSAGE
    mergeCommitMessage: PR_TITLE
    webCommitSignoffRequired: true
  providerConfigRef:
    kind: ProviderConfig
    name: default
