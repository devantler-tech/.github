# devantler-tech/dotnet-template retires: the application template now scaffolds Go and .NET
# applications (ADR 0018, devantler-tech/monorepo#5059), and it never had a consumer.
#
# Archived. The one archive update has landed, so this is an Observe-only mirror: GitHub
# makes an archived repository read-only for settings, and retaining Update would let a
# provider field exposed later retry an update GitHub can never apply. The settings below
# record the repository as it was archived.
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: dotnet-template
  annotations:
    crossplane.io/external-name: dotnet-template
spec:
  managementPolicies: ["Observe"]
  forProvider:
    name: dotnet-template
    archived: true
    description: "A simple .NET template for new projects."
    homepageUrl: ""
    topics: ["template"]
    visibility: public
    isTemplate: true
    hasIssues: true
    hasProjects: true
    hasWiki: false
    hasDiscussions: false
    hasDownloads: false
    allowMergeCommit: false
    allowSquashMerge: true
    allowRebaseMerge: false
    allowAutoMerge: true
    allowUpdateBranch: true
    deleteBranchOnMerge: true
    squashMergeCommitTitle: COMMIT_OR_PR_TITLE
    squashMergeCommitMessage: COMMIT_MESSAGES
    mergeCommitTitle: MERGE_MESSAGE
    mergeCommitMessage: PR_TITLE
    webCommitSignoffRequired: true
  providerConfigRef:
    kind: ProviderConfig
    name: default
