# Countdown to Simba the Cocker Spaniel coming home. Simba arrived, so the site
# was decommissioned (devantler-tech/monorepo#3023) and the repository archived.
# The archive update has landed, so this is now an Observe-only mirror. GitHub
# makes archived repositories read-only for settings; retaining Update or
# LateInitialize would let a newly exposed provider field create an update loop
# that can never converge.
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: doggy-countdown
  annotations:
    crossplane.io/external-name: doggy-countdown
spec:
  managementPolicies: ["Observe"]
  forProvider:
    name: doggy-countdown
    archived: true
  providerConfigRef:
    kind: ProviderConfig
    name: default
