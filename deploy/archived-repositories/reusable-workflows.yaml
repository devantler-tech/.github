# Legacy reusable-workflow library, merged into devantler-tech/actions (#314,
# v7.0.0) and archived per devantler-tech/actions#425 AC3. The archive update
# has landed, so this is now an Observe-only mirror. GitHub makes archived
# repositories read-only for settings; retaining Update or LateInitialize
# would let a newly exposed provider field create an update loop that can never
# converge.
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: Repository
metadata:
  name: reusable-workflows
  annotations:
    crossplane.io/external-name: reusable-workflows
spec:
  managementPolicies: ["Observe"]
  forProvider:
    name: reusable-workflows
    archived: true
  providerConfigRef:
    kind: ProviderConfig
    name: default
