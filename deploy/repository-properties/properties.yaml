metadata:
  name: unifi-scangithubactions
spec:
  managementPolicies: [Observe, Create, Update]
  forProvider:
    repository: "unifi"
    propertyName: ScanGitHubActions
    propertyType: true_false
    propertyValue: ["true"]
  providerConfigRef:
    kind: ProviderConfig
    name: default
---
