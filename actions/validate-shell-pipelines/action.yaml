name: Validate shell pipelines
description: Find early-exit grep assertions in tracked shell scripts before pipefail can invert their result.
author: devantler-tech
inputs:
  working-directory:
    description: Git checkout directory, relative to GITHUB_WORKSPACE or absolute.
    required: false
    default: .
  paths:
    description: Newline-separated relative tracked files or directories to scan. Each scope must contain shell files.
    required: false
    default: .
outputs:
  validated:
    description: The string true after a complete successful scan; empty when unsuccessful.
    value: ${{ steps.validate.outputs.validated }}
runs:
  using: composite
  steps:
    - name: Set up Go for the validator
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false

    - name: Validate shell pipelines
      id: validate
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        SCAN_PATHS: ${{ inputs.paths }}
        GOWORK: "off"
        GOFLAGS: ""
        GOTOOLCHAIN: local
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        temporary=$(mktemp -d "$RUNNER_TEMP/validate-shell-pipelines.XXXXXX")
        trap 'rm -rf "$temporary"' EXIT
        bash "$ACTION_PATH/../../.scripts/retry.sh" go -C "$ACTION_PATH" mod download
        go -C "$ACTION_PATH" build -mod=readonly -trimpath -o "$temporary/validate-shell-pipelines" .
        "$temporary/validate-shell-pipelines" --root "$WORKING_DIRECTORY" --paths "$SCAN_PATHS"
        echo "validated=true" >> "$GITHUB_OUTPUT"
