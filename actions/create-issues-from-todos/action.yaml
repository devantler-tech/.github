name: Create Issues from TODOs
description: Create GitHub issues from TODO comments in code
author: devantler-tech
inputs:
  client-id:
    description: GitHub App Client ID (preferred over the deprecated app-id)
    required: false
  app-id:
    description: 'GitHub App ID. Deprecated: use client-id instead.'
    required: false
  app-private-key:
    description: GitHub App Private Key (required unless optional-project-auth is true and project is empty)
    required: false
  optional-project-auth:
    description: Opt in to generating an App token only for configured project integration
    required: false
    default: 'false'
  project:
    description: GitHub Project to add issues to
    required: false
  ignore:
    description: Regular expression matching repository-relative paths to ignore
    required: false
    default: ""
  exclude-vendored:
    description: Opt in to excluding root vendor/ and third_party/ paths when no explicit ignore is configured; rollout retirement is tracked in devantler-tech/.github#394
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Validate project authentication
      if: ${{ inputs.optional-project-auth == 'true' }}
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        CLIENT_ID: ${{ inputs.client-id }}
        APP_ID: ${{ inputs.app-id }}
      run: |
        if [[ -n "$PROJECT" ]]; then
          if [[ -z "$APP_PRIVATE_KEY" || ( -z "$CLIENT_ID" && -z "$APP_ID" ) ||
                ( -n "$CLIENT_ID" && -n "$APP_ID" ) ]]; then
            echo "::error::Project integration requires app-private-key and exactly one of client-id or app-id."
            exit 1
          fi
        fi
    - name: 🔑 Generate GitHub App Token
      if: ${{ inputs.optional-project-auth != 'true' || inputs.project != '' }}
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: ${{ inputs.client-id }}
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        # Least-privilege: this token is consumed only as the todo-to-issue
        # action's PROJECTS_SECRET (adding issues to an org Project); issue
        # create/close/assign use the workflow's default GITHUB_TOKEN. Scope it
        # to organization projects instead of inheriting the App installation's
        # blanket permissions (zizmor github-app).
        permission-organization-projects: write
    - name: Setup TODO supervisor compiler
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.26.8
        cache: false
    - name: 🧰 Preserve retry helper
      shell: bash
      run: |
        set -euo pipefail
        supervisor="${RUNNER_TEMP}/devantler-todo-guard"
        GOWORK=off GOENV=off GOFLAGS='' GOTOOLCHAIN=local CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -C "${GITHUB_ACTION_PATH}/../../.scripts/todo-guard" -o "$supervisor" ./cmd/todo-guard
        retry_helper="${RUNNER_TEMP}/devantler-actions-retry.sh"
        cp "${GITHUB_ACTION_PATH}/../../.scripts/retry.sh" "$retry_helper"
        chmod +x "$retry_helper"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # Floor is v5.1.15: earlier releases crash the whole workflow with
    # `KeyError: 'web_url'` when a removed to-do marker matches multiple existing
    # issues (GitLab-only field in the ambiguous-match diagnostic). Never downgrade
    # past it. (Lowercase "to-do" avoids this action self-matching its own comment.)
    # Retry only immutable image acquisition. The owned supervisor retries initial
    # language-rule reads before mutations and never replays the scanner.
    - name: Select conventional vendor exclusion
      id: vendored-ignore
      if: ${{ inputs.exclude-vendored == 'true' && inputs.ignore == '' }}
      shell: bash
      run: |
        printf 'ignore=^(vendor|third_party)/\n' >>"$GITHUB_OUTPUT"
    - name: 📝 Create issues from TODOs
      shell: bash
      env:
        INPUT_REPO: ${{ github.repository }}
        INPUT_REPOSITORY_ID: ${{ github.repository_id }}
        INPUT_BEFORE: ${{ github.event.before || github.base_ref }}
        INPUT_COMMITS: ${{ toJSON(github.event.commits) }}
        INPUT_DIFF_URL: ${{ github.event.pull_request.diff_url }}
        INPUT_SHA: ${{ github.sha }}
        INPUT_TOKEN: ${{ github.token }}
        INPUT_CLOSE_ISSUES: "true"
        INPUT_AUTO_P: "true"
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_PROJECTS_SECRET: ${{ steps.app-token.outputs.token }}
        INPUT_AUTO_ASSIGN: "true"
        INPUT_ACTOR: ${{ github.actor }}
        INPUT_GITHUB_URL: ${{ github.api_url }}
        INPUT_GITHUB_SERVER_URL: ${{ github.server_url }}
        INPUT_ESCAPE: "true"
        INPUT_NO_STANDARD: "false"
        INPUT_INSERT_ISSUE_URLS: "false"
        INPUT_IGNORE: ${{ inputs.ignore || steps.vendored-ignore.outputs.ignore }}
        # Pinned by DIGEST, not by tag: this image runs with `github.token` and the
        # App `PROJECTS_SECRET`, so a retag of `:v5.1.15` upstream would otherwise
        # execute unreviewed code with those credentials. The tag is kept in front of
        # the digest for human-readable version context — Docker resolves the digest.
        # When raising the floor, update BOTH halves in the same change.
        TODO_TO_ISSUE_IMAGE: ghcr.io/alstr/todo-to-issue-action:v5.1.15@sha256:a1794cab7e7a0306d6f74dd5249734f2c0b49e47d7549c6cdca4421bced67c9d
      run: |
        set -euo pipefail
        retry() { bash "${RUNNER_TEMP}/devantler-actions-retry.sh" "$@"; }

        retry docker pull "$TODO_TO_ISSUE_IMAGE"
        docker run --rm --pull never \
          --entrypoint /opt/todo-guard \
          --volume "${RUNNER_TEMP}/devantler-todo-guard:/opt/todo-guard:ro" \
          --workdir /github/workspace \
          --volume "$GITHUB_WORKSPACE:/github/workspace" \
          --env GITHUB_ACTIONS=true \
          --env GITHUB_WORKSPACE=/github/workspace \
          --env CI=true \
          --env INPUT_REPO \
          --env INPUT_REPOSITORY_ID \
          --env INPUT_BEFORE \
          --env INPUT_COMMITS \
          --env INPUT_DIFF_URL \
          --env INPUT_SHA \
          --env INPUT_TOKEN \
          --env INPUT_CLOSE_ISSUES \
          --env INPUT_AUTO_P \
          --env INPUT_PROJECT \
          --env INPUT_PROJECTS_SECRET \
          --env INPUT_AUTO_ASSIGN \
          --env INPUT_ACTOR \
          --env INPUT_GITHUB_URL \
          --env INPUT_GITHUB_SERVER_URL \
          --env INPUT_ESCAPE \
          --env INPUT_NO_STANDARD \
          --env INPUT_INSERT_ISSUE_URLS \
          --env INPUT_IGNORE \
          "$TODO_TO_ISSUE_IMAGE"
