name: Triage Stale Issues
description: Remind after 90 inactive days, then close after 30 more days without activity.
author: devantler-tech

inputs:
  enabled:
    description: Temporary rollout opt-in. Omitted or false performs no triage.
    required: false
    default: "false"
  dry-run:
    description: Report proposed changes without changing issues or saved progress.
    required: false
    default: "false"
  github-token:
    description: Repository token with issues write and actions write for the progress cache; read permissions suffice for dry-run.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Triage inactive issues
      if: ${{ inputs.enabled == 'true' }}
      uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
      with:
        repo-token: ${{ inputs.github-token }}
        debug-only: ${{ inputs.dry-run }}
        days-before-issue-stale: 90
        days-before-issue-close: 30
        stale-issue-label: stale
        close-issue-reason: not_planned
        # v11 supports a positive native-type list. Unknown/untyped issues,
        # Epic and Security therefore require explicit triage before closure.
        only-issue-types: Chore,Bug,Feature,Kata,Performance,Refactor,Docs,Spike
        exempt-issue-labels: blocked,keep-open,maintainer-ask,maintainer-ask-urgent
        remove-issue-stale-when-updated: true
        ignore-issue-updates: false
        # Leave PRs alone, including labels from any previous PR automation.
        days-before-pr-stale: -1
        days-before-pr-close: -1
        remove-pr-stale-when-updated: false
        delete-branch: false
        operations-per-run: 100
        ascending: true
        sort-by: updated
        stale-issue-message: |
          > 🤖 Generated by the Agentic Engineer

          This issue has had no activity for 90 days and needs a fresh triage decision.
          Please comment or update it within 30 days if the work is still needed;
          otherwise it will close as not planned. Use `keep-open` for intentionally
          long-lived work, or `blocked` with the current blocker and resume condition.
        close-issue-message: |
          > 🤖 Generated by the Agentic Engineer

          Closed as not planned after 30 additional inactive days following the
          stale reminder. Reopen this issue with current context if the work is
          still needed. This closure records inactivity, not completed delivery.
